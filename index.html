function moneyBackBack(){ var b=S.back; S.back=null; if(b) editTx('e',b.row); else closeModal(); }
function saveMoneyBack(){
  var b=S.back, t=b&&findTx('e',b.row); if(!t){ closeModal(); return; }
  var cur=currencyOf(b.account)||'UAH', amt=amtOf(b.amount,decOf(cur));
  if(!(amt>0)){ toast('Enter how much came back'); return; }
  S.back=null; closeModal();
  moneyBackApply(b.kind,t,{amount:amt,currency:cur,account:b.account,date:b.date||D.today}).send();
  toast(b.kind==='r'?'Refunded \u2014 it no longer counts':'Paid back');
}
/* on screen at once; send() writes it, revert() takes it back */
function moneyBackApply(kind,t,o){
  var tag=kind==='r'?'refund':'owedback';
  var rows=[t].concat(kind==='r'&&isReceipt(t)?linesOf(t.receipt):[]);
  var was=rows.map(function(x){ return x.flags; });
  rows.forEach(function(x){
    var f=allFlags(x).filter(function(k){ return !(kind==='b'&&k==='owed'); });
    if(f.indexOf(tag)<0) f.push(tag);
    x.flags=f.join(',');
  });
  var iid=t.id+'-'+kind, cid='p'+(++S.cid);
  /* after an undo the same id comes back - it must not stay hidden */
  delete S.pendingDel['i:'+iid];
  var inc={k:'i',row:0,id:iid,cid:cid,pending:true,date:o.date,amount:o.amount,currency:o.currency,
           account:o.account,source:backSource(kind),note:t.shop||strip(t.sub)||'',
           uah:o.amount*rateOf(o.currency),real:false,trip:''};
  S.pending[cid]=inc; D.tx.push(inc);
  prep(); render(true);
  var fn=kind==='r'?'refundTx':'owedBack';
  var payload={id:t.id,amount:o.amount,currency:o.currency,account:o.account,date:o.date,rid:newRid()};
  function undo(){
    delete S.pending[cid]; D.tx=D.tx.filter(function(x){ return x.cid!==cid; });
    rows.forEach(function(x,i){ x.flags=was[i]; });
  }
  return {
    send:function(leaving){
      var qid='';
      if(leaving===true){ qid='u'+payload.rid; qPush(qid,fn,payload); }
      bg(fn,payload,function(){ if(qid) qRemove(qid); delete S.pending[cid]; },
                    function(){ if(qid) qRemove(qid); undo(); });
    },
    revert:function(){ undo(); rebuildTx(); prep(); render(true); }
  };
}
/* taking it back is deleting the money that came back */
function undoMoneyBack(kind,row){
  var t=findTx('e',row), inc=t&&linkedInc(t,kind);
  if(!inc){ toast('That money is not in the list \u2014 pull down to refresh'); return; }
  if(inc.pending){ toast('Wait a moment \u2014 it is still saving'); return; }
  closeSheet();
  holdDelete([inc],'deleteTx',txRef(inc),kind==='r'?'Refund undone':'Owed to you again');
}
/* one tap from the list: the whole amount, to the card it was paid with -
   and a few seconds to change either */
function quickBack(row){
  if(apiV()<3){ toast(NEED_V3,7000); return; }
  withRecordId(row,quickBackFor);
}
function quickBackFor(t){
  var row=t.row;
  if(!backSource('b')){ toast('Add a \u201cDebt return\u201d income source in Settings first',6000); return; }
  commitUndo();
  var go=moneyBackApply('b',t,{amount:Math.abs(Number(t.amount)||0),currency:t.currency||'UAH',account:t.account,date:D.today});
  if(S.owedOpen) drawOwed();
  holdAction('Paid back \u00b7 '+strip(t.shop||t.sub||'expense'),{
    commit:go.send,
    revert:function(){ go.revert(); if(S.owedOpen) drawOwed(); },
    edit:function(){ go.revert(); openMoneyBack('b',row,false); }
  });
}
function owedList(){
  return txAll().filter(function(t){ return t.k==='e'&&!t.pending&&stateOf(t)==='owed'; })
    .sort(function(a,b){ return a.date<b.date?1:(a.date>b.date?-1:0); });
}
function owedCard(){
  var l=owedList(); if(!l.length) return '';
  var tot=sum(l,function(t){ return Math.abs(txAmount(t)); });
  return '<button class="glass actcard" onclick="openOwed()" style="'+icStyle(HUE_IN)+'"><span class="ai">'+svgIc('handcoins',18,2)+'</span>'+
    '<span class="at"><b>Owed to you \u00b7 '+bmoney(tot,0)+'</b><span>'+l.length+' payment'+(l.length===1?'':'s')+
    ' you made for someone else</span></span><span class="chevr">\u203a</span></button>';
}
function openOwed(){ S.owedOpen=true; drawOwed(); }
/* one line each: what, when, for whom (the note) - and the button */
function owedRow(t){
  var bits=[fmtShort(t.date)];
  if(t.note) bits.push(t.note);
  if(t.account) bits.push(strip(t.account));
  return '<div class="owedrow"><button class="row" onclick="closeModal();editTx(\'e\','+t.row+')">'+catBadge(t.sub||t.main,t.main)+
    '<span class="rmain"><span class="rtitle" style="display:block">'+esc(strip(t.shop||t.sub||'Expense'))+'</span>'+
    '<span class="rmeta" style="display:block">'+esc(bits.join(' \u00b7 '))+'</span></span>'+
    '<span class="ramt">'+money(Math.abs(txAmount(t)),0)+'</span></button>'+
    '<button class="backb" onclick="quickBack('+t.row+')">Paid back</button></div>';
}
function drawOwed(){
  var l=owedList();
  var h=sheetTop('Owed to you','');
  if(!l.length) h+='<div class="glass"><div class="empty">Nobody owes you anything right now.</div></div>';
  else{
    h+='<p class="tiny" style="margin:0 4px 10px">Tap Paid back when the money arrives. For a few seconds after, you can still change how much came back and where.</p>';
    h+='<div class="glass list">'+l.map(owedRow).join('')+'</div>';
  }
  var back=txAll().filter(function(t){ return t.k==='e'&&stateOf(t)==='owedback'&&t.date>=addDaysIso(D.today,-120); })
    .sort(function(a,b){ return a.date<b.date?1:(a.date>b.date?-1:0); }).slice(0,8);
  if(back.length) h+='<div class="sect"><span>Paid back lately</span></div><div class="glass list">'+
    back.map(function(t){ return txRow(t,"closeModal();editTx('e',"+t.row+")"); }).join('')+'</div>';
  h+='<p class="tiny" style="margin:12px 4px 0">Mark a payment as owed from its own page: the \u201cOwed to me\u201d chip under Marks.</p>';
  h+=sheetEnd();
  document.getElementById('modal').innerHTML=h;
}
/* what the record's own page says about all this, just above Delete */
function stateBox(s){
  if(!s.edit||apiV()<3) return '';
  var t=findTx(s.kind,s.row); if(!t||t.pending) return '';
  if(t.k==='i'){
    if(!isLinkedInc(t)) return '';
    var p=linkedPurchase(t), r=/-r$/.test(t.id);
    return '<div class="stbox"><span class="stt"><b>'+(r?'Money back from a refund':'Paid back to you')+'</b>'+
      (p?esc(strip(p.shop||p.sub||'A purchase'))+' \u00b7 '+esc(fmtShort(p.date))+' \u00b7 ':'')+
      'Delete this to undo it.</span>'+
      (p?'<button onclick="editTx(\'e\','+p.row+')">Open</button>':'')+'</div>';
  }
  if(!isPurchase(t)) return '';
  var st=stateOf(t);
  if(st==='refund'||st==='owedback'){
    var kind=st==='refund'?'r':'b', owner=t, inc=linkedInc(t,kind);
    /* a line refunded with the whole receipt: the money belongs to the receipt */
    if(!inc&&kind==='r'&&isLine(t)){ owner=receiptHead(t.receipt); inc=owner&&linkedInc(owner,'r'); }
    var what=inc?(' \u00b7 +'+(PRIV.all?DOTS:money(Math.abs(inc.uah||0),2))+' to '+strip(inc.account)+' on '+fmtShort(inc.date)):'';
    return '<div class="stbox"><span class="stt"><b>'+(st==='refund'?(owner!==t?'Refunded with its receipt':'Refunded'):'Paid back')+esc(what)+'</b>'+
      'Counted nowhere \u2014 not as spending, not as income.</span>'+
      (inc&&owner?'<button onclick="undoMoneyBack(\''+kind+'\','+owner.row+')">Undo</button>':'')+'</div>';
  }
  /* owed as the sheet has it now - toggled here, it is written on Save */
  var owedNow=(s.flags||[]).indexOf('owed')>-1;
  if(owedNow) return '<div class="stbox"><span class="stt"><b>Owed to you</b>Not counted as your spending while you wait for it.</span>'+
    (st==='owed'?'<button onclick="openMoneyBack(\'b\','+t.row+',true)">Paid back</button>':'')+
    '<button class="stno" onclick="toggleOwed()">Not owed</button></div>';
  return '<div class="stacts"><button class="refbtn" onclick="openMoneyBack(\'r\','+t.row+',true)">'+svgIc('refund',17,2)+'Refund</button>'+
    '<button class="refbtn" onclick="toggleOwed()">'+svgIc('handcoins',17,2)+'Owed to me</button></div>';
}

/* ══════ projects ════════════════════════════════════════════════════════
   A folder of expenses - "Renovation", "Car repair" - counted the way a
   trip is, but with no dates: anything can go in, whenever it was. It is a
   mark on the record (p:Name), so it shows under Marks, where it comes off
   again with one tap. */
function projectStats(name){
  var list=txAll().filter(function(t){ return t.k==='e'&&inProject(t,name); });
  var spend=list.filter(function(t){ return realExp(t)&&!isXfer(t)&&!isCorr(t); });
  var total=sum(spend,function(t){ return Math.abs(txAmount(t)); });
  var first='', last='';
  list.forEach(function(t){ if(!first||t.date<first) first=t.date; if(!last||t.date>last) last=t.date; });
  var byCat={};
  spend.forEach(function(t){
    var k=t.main||(isReceipt(t)?UNSPLIT:'Other');
    byCat[k]=(byCat[k]||0)+Math.abs(txAmount(t));
  });
  var months=first?Math.max(1,(Number(last.slice(0,4))-Number(first.slice(0,4)))*12+Number(last.slice(5,7))-Number(first.slice(5,7))+1):1;
  return {list:list,spend:spend,total:total,first:first,last:last,months:months,byCat:byCat};
}
function openProjectPicker(title,onPick,current){
  S.projPick={title:title,onPick:onPick,current:current||[]};
  drawProjectPicker();
}
function drawProjectPicker(){
  var P=S.projPick; if(!P) return;
  var names=projectNames();
  var h='<div class="scrim" style="z-index:60" onclick="closePicker()"></div><div class="sheet" style="z-index:61">'+
    '<div class="sheet-head"><button class="xbtn" onclick="closePicker()">\u2715</button>'+
    '<span class="sheet-title">'+esc(P.title)+'</span><span style="width:32px"></span></div>'+
    '<div class="sheet-body" style="margin-top:14px">';
  /* Savings transfers go towards a goal instead */
  if(P.goals){
    document.getElementById('modal2').innerHTML=h+goalPickHtml(P)+'<div style="height:10px"></div></div></div>';
    return;
  }
  h+=
    '<div class="glass"><div class="newproj"><input class="tinput" id="newproj" maxlength="40" autocomplete="off"'+
      ' placeholder="'+(names.length?'New project':'Name it \u2014 e.g. Renovation')+'" enterkeyhint="done"'+
      ' onkeydown="if(event.key===\'Enter\'){event.preventDefault();newProjectGo();}">'+
      '<button onclick="newProjectGo()">Add</button></div></div>';
  if(names.length){
    h+='<div class="sect" style="margin-top:14px"><span>Projects</span></div><div class="glass list">'+names.map(function(n){
      var st=projectStats(n), on=P.current.indexOf(n)>-1;
      return '<button class="row" onclick="projectPick('+q(n)+')">'+icBadge(projIcon(n),hueOf(n))+
        '<span class="rmain"><span class="rtitle" style="display:block">'+esc(n)+'</span>'+
        '<span class="rmeta" style="display:block">'+(st.spend.length?st.spend.length+' expense'+(st.spend.length===1?'':'s')+' \u00b7 '+money(st.total,0):'Nothing in it yet')+'</span></span>'+
        '<span class="tick" style="color:'+(on?ACCENT:'transparent')+'">\u2713</span></button>';
    }).join('')+'</div>';
  }
  h+='<div style="height:10px"></div></div></div>';
  document.getElementById('modal2').innerHTML=h;
}
function newProjectGo(){
  var el=document.getElementById('newproj'), n=cleanProject(el&&el.value);
  if(!n){ toast('Give the project a name'); if(el) el.focus(); return; }
  var same=projectNames().filter(function(x){ return x.toLowerCase()===n.toLowerCase(); })[0];
  if(same) n=same;
  else{ var list=(pref('projects',[])||[]).slice(); list.push(n); setPref('projects',list); }
  projectPick(n);
}
function projectPick(n){
  var P=S.projPick; S.projPick=null; closePicker();
  if(P&&P.onPick) P.onPick(n);
}
/* a project's icon comes from its name, like a category's - a folder when
   the name says nothing */
function projIcon(n){ var k=icKey(n); return k==='tag'?'folder':k; }
/* from the action bar: everything picked that is an expense goes in */
function selProjectWhy(){
  var it=selItems();
  if(!it.some(function(t){ return t.k==='e'&&!isXfer(t)&&!isCorr(t); })) return 'Only expenses can go into a project';
  if(it.some(function(t){ return t.pending||!t.row; })) return 'Wait a moment \u2014 some of them are still saving';
  return '';
}
function selProject(){
  if(apiV()<3){ toast(NEED_V3,7000); return; }
  var why=selProjectWhy(); if(why){ toast(why); return; }
  var it=selItems().filter(function(t){ return t.k==='e'&&!isXfer(t)&&!isCorr(t); });
  /* Savings transfers - and only they - go towards a savings goal */
  if(allSavings(it)){ openGoalPicker(it); return; }
  var common=projectNames().filter(function(n){ return it.every(function(t){ return inProject(t,n); }); });
  openProjectPicker('Add to a project',function(n){ addToProject(it,n); },common);
}
function addToProject(items,n){
  var tag='p:'+n, touched=[];
  items.forEach(function(t){
    [t].concat(isReceipt(t)?linesOf(t.receipt):[]).forEach(function(x){
      if(inProject(x,n)) return;
      touched.push({t:x,was:x.flags});
      x.flags=allFlags(x).concat([tag]).join(',');
    });
  });
  S.sel=null; S.selDel=0; render(true);
  if(!touched.length){ toast('Already in '+n); return; }
  toast((items.length===1?'Added to ':'Added '+items.length+' to ')+n);
  bg('editMany',{items:items.map(txRef),flagAdd:[tag]},null,function(){ touched.forEach(function(x){ x.t.flags=x.was; }); });
}
/* the chips under Marks on a record's own page: one tap takes it out */
function dropSheetProject(n){
  var s=S.sheet; if(!s) return;
  s.flags=(s.flags||[]).filter(function(k){ return k!=='p:'+n; });
  redrawMarks();
}
function projectsOfFlags(f){ return (f||[]).filter(function(k){ return String(k).slice(0,2)==='p:'; }).map(function(k){ return String(k).slice(2); }); }
/* one project, summed up the way a trip is */
function openProjectSum(name,back){
  var ps=projectStats(name);
  S.projOpen=name;
  var h=sheetTop(name,'',back||'');
  h+='<div class="hero" style="padding:20px">'+
    '<div class="eyebrow">'+esc(ps.first?(fmtShort(ps.first)+(ps.last&&ps.last!==ps.first?' \u2013 '+fmtShort(ps.last):'')):'Project')+'</div>'+
    '<div class="big" style="margin-top:10px">'+money(ps.total,0)+'</div>'+
    '<div class="tiny" style="margin-top:6px">'+ps.spend.length+' expense'+(ps.spend.length===1?'':'s')+
      (ps.months>1?' \u00b7 about '+money(ps.total/ps.months,0)+' a month':'')+'</div></div>';
  var cats=Object.keys(ps.byCat).sort(function(a,b){ return ps.byCat[b]-ps.byCat[a]; });
  if(cats.length){
    h+='<div class="sect"><span>Where it went</span></div><div class="glass" style="padding:4px 0">'+
      cats.map(function(c){
        var v=ps.byCat[c], pc=ps.total?Math.max(2,v/ps.total*100):0;
        return '<div class="triprow"><div class="th"><span>'+inIc(c)+esc(strip(c))+'</span><b>'+money(v,0)+'</b></div>'+
          '<div class="tbar"><i style="width:'+pc.toFixed(1)+'%;background:'+tint(c,.85)+'"></i></div></div>';
      }).join('')+'</div>';
  }
  var hid=receiptHidden(ps.list);
  var recs=ps.list.filter(function(t){ return hid.indexOf(t)<0; }).sort(function(a,b){
    if(a.date!==b.date) return a.date<b.date?1:-1;
    return orderKey(b)-orderKey(a);
  });
  var pfold=feeFold(recs);
  recs=recs.filter(function(t){ return pfold.hidden.indexOf(t)<0; });
  if(recs.length){
    h+='<div class="sect"><span>Records</span></div><div class="glass list">'+recs.map(function(t){
      return isReceipt(t)?receiptBlock(t,false):txRow(t,'editTx('+q(t.k)+','+t.row+')',false,undefined,(t.k==='e'&&t.id&&pfold.on[t.id])||null);
    }).join('')+'</div>';
  }else h+='<div class="glass" style="margin-top:12px"><div class="empty">Nothing in this project yet. Hold a record in Activity, then tap Project.</div></div>';
  h+='<div class="sect"><span>Name</span></div><div class="glass"><div class="newproj">'+
    '<input class="tinput" id="projname" maxlength="40" autocomplete="off" value="'+esc(name)+'"'+
    ' onkeydown="if(event.key===\'Enter\'){event.preventDefault();renameProject();}">'+
    '<button onclick="renameProject()">Rename</button></div></div>';
  h+='<button class="delbtn" id="projdel" onclick="deleteProject()">Delete project</button>';
  h+=sheetEnd();
  document.getElementById('modal').innerHTML=h;
}
function renameProject(){
  var old=S.projOpen; if(!old) return;
  var el=document.getElementById('projname'), n=cleanProject(el&&el.value);
  if(!n){ toast('Give the project a name'); return; }
  if(n===old){ toast('That is its name already'); return; }
  if(apiV()<3){ toast(NEED_V3,7000); return; }
  var ps=projectStats(old), items=ps.list.filter(function(t){ return !t.pending&&t.row; });
  var was=[];
  ps.list.forEach(function(t){ was.push({t:t,f:t.flags}); t.flags=allFlags(t).map(function(k){ return k==='p:'+old?'p:'+n:k; }).join(','); });
  var list=(pref('projects',[])||[]).map(function(x){ return x===old?n:x; });
  if(list.indexOf(n)<0) list.push(n);
  setPref('projects',list);
  S.projOpen=n; openProjectSum(n); render(true);
  if(items.length) bg('editMany',{items:items.map(txRef),flagDel:['p:'+old],flagAdd:['p:'+n]},null,
    function(){ was.forEach(function(x){ x.t.flags=x.f; }); });
}
function deleteProject(){
  var name=S.projOpen; if(!name) return;
  if(!S.projKill){
    S.projKill=1;
    var b=document.getElementById('projdel'); if(b) b.textContent='Tap again \u2014 the records stay, only the project goes';
    setTimeout(function(){ S.projKill=0; },3500);
    return;
  }
  S.projKill=0;
  var ps=projectStats(name), items=ps.list.filter(function(t){ return !t.pending&&t.row; }), was=[];
  ps.list.forEach(function(t){ was.push({t:t,f:t.flags}); t.flags=allFlags(t).filter(function(k){ return k!=='p:'+name; }).join(','); });
  setPref('projects',(pref('projects',[])||[]).filter(function(x){ return x!==name; }));
  closeModal(); render(true); toast('Project deleted');
  if(items.length&&apiV()>=3) bg('editMany',{items:items.map(txRef),flagDel:['p:'+name]},null,
    function(){ was.forEach(function(x){ x.t.flags=x.f; }); });
}
/* Summary: trips and projects in one list, counted the same way */
function foldersSection(){
  var rows=[];
  tripNames().forEach(function(n){ var st=tripStats(n); rows.push({kind:'t',name:n,total:st.total,last:st.last||'',first:st.first||'',n:st.spend.length}); });
  if(apiV()>=3||projectNames().length) projectNames().forEach(function(n){
    var st=projectStats(n); rows.push({kind:'p',name:n,total:st.total,last:st.last||'9999',first:st.first||'',n:st.spend.length});
  });
  if(!rows.length) return '';
  rows.sort(function(a,b){ return a.last<b.last?1:(a.last>b.last?-1:0); });
  var all=S.foldersAll?rows:rows.slice(0,6);
  var h='<div class="sect"><span>Trips & projects</span><span class="r">'+rows.length+'</span></div><div class="glass" style="padding:4px 0">';
  h+=all.map(function(r){
    var when=r.first?(fmtShort(r.first)+(r.last&&r.last!==r.first&&r.last!=='9999'?' \u2013 '+fmtShort(r.last):'')+' \u00b7 '):'';
    var ic=r.kind==='t'?'plane':projIcon(r.name);
    return navRow('<span class="inic" style="color:'+ok(.52,.12,r.kind==='t'?255:hueOf(r.name))+'">'+svgIc(ic,16,2)+'</span>'+esc(r.name),
      when+money(r.total,0)+(r.kind==='t'?' \u00b7 trip':' \u00b7 project'),
      r.kind==='t'?'openTripSum('+q(r.name)+')':'openProjectSum('+q(r.name)+')');
  }).join('');
  if(rows.length>6) h+='<button class="kvmore" onclick="S.foldersAll=!S.foldersAll;render(true)">'+(S.foldersAll?'Show fewer':'Show all '+rows.length)+'</button>';
  return h+'</div>';
}

/* ══════ a fee paid in the same go ═══════════════════════════════════════
   An ATM's commission, a card-to-card transfer's: typed in with the
   withdrawal or the transfer and saved as an expense of its own, on the
   same card and day, just under it. Its id is the payment's id plus -f, so
   deleting or moving the payment takes the fee along. */
function feeSubName(){
  var l=(D.setup&&D.setup.subcategories)||[];
  for(var i=0;i<l.length;i++) if(FEE_RE.test(l[i].name)) return l[i].name;
  return '';
}
/* A transfer's form - a withdrawal is one - asks for the fee. On a saved
   one it can be changed or cleared, once the sheet script knows how. */
function feeShown(s){
  return xferForm(s)&&!!feeSubName()&&(!s.edit||apiV()>=4);
}
/* what the fee is called follows where the money goes */
function feeName(s){
  if(!s.toAccount) return isAtmName(s.sub)?'ATM fee':'Fee';
  return xferWords(s.account,s.toAccount).atm?'ATM fee':'Transfer fee';
}
function feeField(s){
  if(!feeShown(s)) return '';
  var hint=(s.edit&&s.feeWas)?'clear it to remove':'optional';
  return '<div class="fieldlabel"><span id="f_feelab">'+feeName(s)+'</span> <span class="opt">'+hint+'</span></div>'+
    '<input class="tinput" id="f_fee" inputmode="decimal" autocomplete="off" placeholder="0" value="'+esc(s.fee||'')+'" oninput="shq(\'fee\',this.value)">';
}
function feeRelabel(){
  var s=S.sheet, el=document.getElementById('f_feelab');
  if(s&&el) el.textContent=feeName(s);
}
/* the fee row shown straight away, before the sheet has it */
function feeLocal(s,fee,cur,parentId,cid,note,trip){
  var sub=feeSubName(), sm=D.subMap[sub];
  return {k:'e',row:0,id:parentId+'-f',cid:cid,pending:true,date:s.date,amount:fee,currency:cur,account:s.account,
          main:sm?sm.main:'',sub:sub,shop:'',note:note||'Transfer fee',uah:fee*rateOf(cur),
          real:sm?sm.real:true,flags:'',sched:'',trip:trip===undefined?(s.trip||''):(trip||'')};
}
/* one write after another: the second only goes once the first is in.
   cleanup runs the moment the answer arrives, as bg's own does; next only
   when it was not a refusal. */
function bgThen(fn,payload,next,rollback,cleanup){
  var failed=false;
  bg(fn,payload,function(){ if(cleanup) cleanup(); setTimeout(function(){ if(!failed&&next) next(); },0); },
     function(){ failed=true; if(rollback) rollback(); });
}

/* ══════ which card to pay with ══════════════════════════════════════════
   The cashback text on every account ("Groceries - 5%") read against the
   category being entered. A category is matched by what it means - the
   same icon, or the same family of icons - as well as by its words, so
   "Supermarkets" covers Groceries and "Restaurants" covers a café. */
var CB_GROUP={cart:'groc',basket:'groc',carrot:'groc',croissant:'groc',candy:'groc',apple:'groc',wine:'groc',zap:'groc',
  coffee:'dine',utensils:'dine',burger:'dine',pizza:'dine',beer:'dine',moped:'dine',
  taxi:'taxi',bus:'transit',busfront:'transit',metro:'transit',tram:'transit',van:'transit',train:'transit',
  fuel:'car',parking:'car',car:'car',pill:'pharm',
  stethoscope:'med',tooth:'med',testtube:'med',glasses:'med',heartpulse:'med',
  perfume:'beauty',scissors:'beauty',sparkles:'beauty',bath:'beauty',dumbbell:'sport',run:'sport',
  clapper:'fun',mic:'fun',ticket:'fun',party:'fun',bowling:'fun',ferris:'fun',gamepad:'fun',dice:'fun',
  book:'books',shirt:'clothes',shoe:'clothes',bag:'clothes',watch:'clothes',
  laptop:'tech',laptop2:'tech',cable:'tech',music:'tech',phone:'telecom',wifi:'telecom',bulb:'util',houseplug:'util',
  plane:'travel',bed:'travel',luggage:'travel',castle:'travel',flower:'flowers',gift:'gifts',toy:'kids',baby:'kids',
  paw:'pets',sofa:'home',lamp:'home',wrench:'home',house:'home',repeat:'subs',tv:'subs',
  cap:'edu',presentation:'edu',university:'edu',package:'post'};
var CB_ANY=/^(all|any|every|everything|other|anything|усі|всі|будь|все|інше|любые|прочее)/i;
function cbRate(r){ var n=parseFloat(String(r||'').replace(',','.')); return isNaN(n)?0:n; }
function cbFor(a,sub,main){
  if(!a) return null;
  var keys=[], groups=[];
  [icKey(sub,main,1),icKey(main,'',1)].forEach(function(k){
    if(k&&k!=='tag'&&keys.indexOf(k)<0){ keys.push(k); if(CB_GROUP[k]) groups.push(CB_GROUP[k]); }
  });
  var words=[shopStrict(strip(sub)),shopStrict(strip(main))].filter(function(w){ return w.length>=3; });
  var best=null;
  cashbackList(a).forEach(function(c){
    var r=cbRate(c.rate); if(!(r>0)) return;
    var lab=strip(c.label)||c.label, k=icKey(lab,'',1), L=shopStrict(lab);
    var hit=CB_ANY.test(lab)||keys.indexOf(k)>-1||(CB_GROUP[k]&&groups.indexOf(CB_GROUP[k])>-1)||
      (L.length>=4&&words.some(function(w){ return w.indexOf(L)>-1||L.indexOf(w)>-1; }));
    if(hit&&(!best||r>best.rate)) best={rate:r,label:lab};
  });
  return best;
}
function cbBest(sub,main){
  var out=null;
  (D.accounts||[]).forEach(function(a){
    var c=cbFor(a,sub,main);
    if(c&&(!out||c.rate>out.rate)) out={acc:a.name,rate:c.rate,label:c.label};
  });
  return out;
}
function cbHintHtml(s){
  if(!s||s.kind!=='e'||s.receipt||isXferSub(s.sub)||isCorrName(s.sub)||(!s.sub&&!s.main)) return '';
  var best=cbBest(s.sub,s.main); if(!best) return '';
  var cur=cbFor(D.accMap[s.account],s.sub,s.main);
  if(cur&&cur.rate>=best.rate) return '<div class="cbhint have" id="cbhint">'+svgIc('percent',13,2)+
    '<span><b>'+esc(numStr(cur.rate))+'% back</b> with this card · '+esc(cur.label)+'</span></div>';
  /* a tip, not a question: the card stays the one you picked */
  return '<div class="cbhint" id="cbhint">'+svgIc('percent',13,2)+'<span><b>'+esc(strip(best.acc))+'</b> gives '+
    esc(numStr(best.rate))+'% back here'+(cur?' (this card '+esc(numStr(cur.rate))+'%)':'')+'</span></div>';
}

/* ══════ what the Calendar has for today and tomorrow ══════════════════════
   The payments due today and tomorrow that are not written down yet, as one
   card at the top of Activity. Tapping it lists them, each with the tick
   the Calendar has; the cross puts the card away until the next day. When
   the sheet cannot say what was paid (no Schedule column yet), a record
   with the payment's name from the last few days counts as paid. */
function upcomingDue(){
  var items=(D.calendar&&D.calendar.items)||[], out={today:[],tomorrow:[]};
  if(!items.length) return out;
  var pm=paidMap(), from=trackFrom(), tom=addDaysIso(D.today,1);
  items.forEach(function(it){
    occList(it,D.today,tom).forEach(function(o){
      if(from?pm[schedKey(it,o)]:upcPaidGuess(it,o)) return;
      (o===D.today?out.today:out.tomorrow).push({it:it,o:o});
    });
  });
  return out;
}
function upcPaidGuess(it,o){
  var name=shopStrict(it.service||''), lo=addDaysIso(o,-3);
  if(name.length<3) return false;
  return txAll().some(function(t){
    if(t.k!=='e'||t.date<lo||t.date>D.today) return false;
    return nameHit(t,name);
  });
}
/* a record that names a Calendar payment, in its shop or in its note (a
   payment written down from the Calendar keeps its name in the note) */
function nameHit(t,name){
  if(!name) return false;
  return [t.shop,t.note].some(function(v){
    var fs=v?shopStrict(v):'';
    return fs.length>=3&&(fs.indexOf(name)>=0||name.indexOf(fs)>=0);
  });
}
function upcTotal(list){ return sum(list,function(e){ return Number(e.it.uah||e.it.cost)||0; }); }
function upcomingCard(){
  if(pref('upcOff','')===D.today) return '';
  var u=upcomingDue(), n=u.today.length, m=u.tomorrow.length;
  if(!n&&!m) return '';
  var list=n?u.today:u.tomorrow, cnt=list.length;
  var names=list.map(function(e){ return e.it.service; });
  var sub=esc(names.slice(0,3).join(', ')+(names.length>3?' +'+(names.length-3):''))+' \u00b7 '+money(upcTotal(list),0)+
    (n&&m?' \u00b7 '+m+' more tomorrow':'');
  return '<div class="glass actcard upcard" role="button" tabindex="0" style="'+icStyle(n?27:255)+'" onclick="drawUpcoming()">'+
    '<span class="ai">'+svgIc('calendar',18,2)+'</span>'+
    '<div class="at"><b>'+cnt+' upcoming expense'+(cnt===1?'':'s')+(n?' today':' tomorrow')+'</b><span>'+sub+'</span></div>'+
    '<button class="actx" onclick="event.stopPropagation();upcomingOff()" aria-label="Close">\u2715</button></div>';
}

/* the list behind the card: the Calendar's own rows, today first */
function drawUpcoming(){
  var u=upcomingDue(), pm=paidMap();

  else h+='<p class="tiny" style="margin:12px 6px 0;line-height:1.45">Tap the circle once it is paid. Tap the name to change the payment in the Calendar.</p>';

/* ══════ credit cards: how much, by when ══════════════════════════════════
   What avoids the fees is the whole debt by the "Pay debt by" date - the
   minimum only avoids the penalty. Both are said, the whole debt first. */
function cardDebt(a){ return Math.max(0,-(Number(a&&a.balance)||0)); }
function accMoney(a,v,dec){
  var c=(a&&a.currency)||'UAH';
  return c==='UAH'?bmoney(v,dec===undefined?2:dec):(anyHidden()?DOTS:esc(numStr(Math.round(v*100)/100)+' '+c));
}
function daysLeftWords(iso0){
  var due=parseD(iso0); if(isNaN(due.getTime())) return '';
  var left=daysBetween(due,parseD(D.today));
  return left<0?'overdue':(left===0?'today':(left===1?'tomorrow':'in '+left+' days'));
}
function payLine(a){
  if(!a.payBy) return "";
  var debt=cardDebt(a), min=Number(a.minPay)||0;
  if(!(debt>0.005)&&!(min>0)) return "";
  var due=parseD(a.payBy);
  var left=isNaN(due.getTime())?99:daysBetween(due,parseD(D.today));
  var main=debt>0.005
    ?'Pay <b>'+accMoney(a,debt)+'</b> by '+esc(fmtShort(a.payBy))
    :'Pay <b>'+accMoney(a,min)+'</b> by '+esc(fmtShort(a.payBy));
  return '<div class="payrow'+(left<=3?' soon':'')+'"><span class="paychip">'+main+' · '+esc(daysLeftWords(a.payBy))+'</span></div>'+
    ((debt>0.005&&min>0&&min<debt-0.005)?'<div class="payrow"><span class="paymin">Minimum '+accMoney(a,min)+'</span></div>':'');
}

/* ══════ subscriptions not in the Calendar yet ════════════════════════════
   The same shop, one charge a month, three months running, about the same
   amount (within 15%) around the same day (within 4). Anything already in
   the Calendar, or waved away once, is not suggested again. */
function subCandidates(){
  var cal=(D.calendar&&D.calendar.items)||[];
  var calN=cal.map(function(it){ return shopStrict(it.service); }).filter(Boolean);
  var skip=pref('notSubs',[])||[], added=S.subAdded||{};
  var from=addDaysIso(D.today,-130), by={};
  txAll().forEach(function(t){
    if(t.k!=='e'||t.pending||t.date<from||t.date>D.today||!t.shop||isXfer(t)||isCorr(t)||isReceipt(t)||isLine(t)||outOfStats(t)) return;
    if(shopParts(t.shop).length>1) return;
    var k=shopStrict(t.shop); if(k.length<2) return;
    (by[k]=by[k]||[]).push(t);
  });
  function dd(a,b){ var x=Math.abs(a-b); return Math.min(x,31-x); }
  var out=[];
  Object.keys(by).forEach(function(k){
    if(skip.indexOf(k)>-1||added[k]) return;
    if(calN.some(function(c){ return c===k||(c.length>=4&&k.indexOf(c)>-1)||(k.length>=4&&c.indexOf(k)>-1); })) return;
    var months={};
    by[k].forEach(function(t){ var m=ym(t.date); (months[m]=months[m]||[]).push(t); });
    var ms=Object.keys(months).sort();
    if(ms.length<3) return;
    var l3=ms.slice(-3);
    if(shiftMonth(l3[0],1)!==l3[1]||shiftMonth(l3[1],1)!==l3[2]) return;
    if(l3[2]<shiftMonth(D.thisMonth,-1)) return;               /* stopped since */
    if(l3.some(function(m){ return months[m].length!==1; })) return;
    var ch=l3.map(function(m){ return months[m][0]; });
    if(ch.some(function(t){ return t.sched; })) return;            /* already a Calendar payment */
    var am=ch.map(function(t){ return Math.abs(txAmount(t)); }), med=am.slice().sort(function(a,b){ return a-b; })[1];
    if(!(med>0)||am.some(function(a){ return Math.abs(a-med)>med*0.15; })) return;
    var dy=ch.map(function(t){ return Number(t.date.slice(8,10)); });
    if(dd(dy[0],dy[1])>4||dd(dy[1],dy[2])>4||dd(dy[0],dy[2])>4) return;
    var last=ch[2];
    out.push({key:k,name:String(last.shop).trim(),t:last,amount:Math.abs(Number(last.amount)||0),currency:last.currency||'UAH',day:dy[2]});
  });
  out.sort(function(a,b){ return a.t.date<b.t.date?1:-1; });
  return out;
}
function ordinal(n){ var s=['th','st','nd','rd'], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
function subKind(){
  var l=(D.calendar&&D.calendar.items)||[];
  for(var i=0;i<l.length;i++) if(/sub/i.test(l[i].kind||'')) return l[i].kind;
  return 'Subscription';
}
function subCards(){
  var l=subCandidates(); if(!l.length) return '';
  return l.slice(0,2).map(function(c){
    var amt=c.currency==='UAH'?money(c.amount,0):(PRIV.all?DOTS:esc(numStr(c.amount)+' '+c.currency));
    return '<div class="glass actcard" style="'+icStyle(255)+'"><span class="ai">'+svgIc('repeat',18,2)+'</span><div class="at">'+
      '<b>'+esc(c.name)+' looks like a subscription</b><span>'+amt+' around the '+ordinal(c.day)+', three months running.</span>'+
      '<div class="actbtns"><button class="go" onclick="addSubCal('+q(c.key)+')">Add to Calendar</button>'+
      '<button onclick="notSub('+q(c.key)+')">It is not</button></div></div></div>';
  }).join('')+(l.length>2?'<p class="tiny" style="margin:8px 6px 0">'+(l.length-2)+' more like that — they show up as you answer these.</p>':'');
}
function addSubCal(key){
  var c=subCandidates().filter(function(x){ return x.key===key; })[0]; if(!c) return;
  var t=c.t;
  var item={service:c.name,cost:c.amount,currency:c.currency,kind:subKind(),every:1,unit:'Months',
            first:t.date,repeats:'Forever',account:t.account,notes:''};
  /* next month it is filled in with the same category, in one tap */
  var seen=pref('calCat',{})||{};
  if(t.sub&&seen[c.name]!==t.sub){ var n={}; for(var k in seen) if(seen.hasOwnProperty(k)) n[k]=seen[k]; n[c.name]=t.sub; setPref('calCat',n); }
  S.subAdded=S.subAdded||{}; S.subAdded[key]=1;
  render(true); toast(c.name+' is in the Calendar now');
  var ref=txRef(t); ref.sched=c.name+'|'+t.date;
  /* the charge that is already in the list is this month's payment of it */
  bgThen('saveCalendar',{adds:[item]},function(){ if(D.sched) bg('linkSchedule',ref); });
}
function notSub(key){
  var l=(pref('notSubs',[])||[]).slice(); if(l.indexOf(key)<0) l.push(key);
  setPref('notSubs',l.slice(-150)); render(true);
}

/* ══════ cancel before it renews ═════════════════════════════════════════
   A trial or a subscription you mean to stop: the date it would renew,
   kept with the app's settings. The sheet script sends a notification three
   days before and the day before; the Calendar shows a card for the week. */
function cancelMap(){ var m=pref('cancelBy',{}); return (m&&typeof m==='object'&&!(m instanceof Array))?m:{}; }
/* the shop a Calendar payment is paid at, kept by the payment's name */
function calShopMap(){ var m=pref('calShop',{}); return (m&&typeof m==='object'&&!(m instanceof Array))?m:{}; }
function calShopOf(svc){ return String(calShopMap()[svc||'']||''); }
function setCalShop(svc,shop,oldSvc){
  var m=calShopMap(), n={}, k;
  for(k in m) if(m.hasOwnProperty(k)&&k!==svc&&k!==oldSvc) n[k]=m[k];
  if(svc&&shop) n[svc]=shop;
  setPref('calShop',n);
}
function cancelOf(svc){ var v=cancelMap()[svc]; return /^\d{4}-\d{2}-\d{2}/.test(String(v||''))?String(v).slice(0,10):''; }
function setCancel(svc,date,oldSvc){
  var m=cancelMap(), n={}, k;
  for(k in m) if(m.hasOwnProperty(k)&&k!==svc&&k!==oldSvc) n[k]=m[k];
  if(svc&&date) n[svc]=date;
  setPref('cancelBy',n);
}
function cancelCards(){
  var m=cancelMap(), out=[];
  Object.keys(m).forEach(function(svc){
    var by=cancelOf(svc); if(!by) return;
    var left=daysBetween(parseD(by),parseD(D.today));
    if(left<-7||left>7) return;
    out.push({svc:svc,by:by,left:left});
  });
  out.sort(function(a,b){ return a.by<b.by?-1:1; });
  return out.map(function(x){
    var it=calBySvc(x.svc);
    var when=x.left<0?('was due to renew on '+fmtShort(x.by)):(x.left===0?'renews today':(x.left===1?'renews tomorrow':'renews in '+x.left+' days, on '+fmtShort(x.by)));
    return '<div class="glass actcard" style="'+icStyle(45)+'"><span class="ai">'+svgIc('alert',18,2)+'</span><div class="at">'+
      '<b>Cancel '+esc(strip(x.svc))+'</b><span>It '+esc(when)+(x.left>=0?' unless you cancel it.':'.')+'</span>'+
      '<div class="actbtns"><button class="go" onclick="cancelDone('+q(x.svc)+')">I cancelled it</button>'+
      (it?'<button onclick="openCalEdit('+it.row+')">Open</button>':'')+'</div></div></div>';
  }).join('');
}
function cancelDone(svc){
  setCancel('','',svc);
  render(true);
  var it=calBySvc(svc);

var IC_UI=['eye','eyeoff','more','refresh','settings','chevdown','check','grid','search','x','list','in','out','merge'];

/* on Save in Settings: the picked icons, keyed by the names as saved */
function saveIcons(){

/* ══════ shop rules ════════════════════════════════════════════════════════
   "Silpo is Groceries, paid with Mono Black": typing a shop that has a rule
   fills its category and its card in, the way a subcategory fills in its
   default shop. Only what the rule itself put there is ever replaced - a
   category or a card you picked stays. A rule is kept as the category's
   name alone, or as {sub, acc} once it has a card. */
function shopRules(){ var m=pref('shopCat',{}); return (m&&typeof m==='object'&&!(m instanceof Array))?m:{}; }
function ruleParts(v){
  if(v&&typeof v==='object') return {sub:String(v.sub||''),acc:String(v.acc||'')};
  return {sub:String(v||''),acc:''};
}
function ruleFor(shop){
  var m=shopRules(), parts=shopParts(shop);
  for(var i=0;i<parts.length;i++){
    var k=shopStrict(parts[i]); if(!k) continue;
    for(var n in m) if(m.hasOwnProperty(n)&&shopStrict(n)===k) return ruleParts(m[n]);
  }
  return null;
}
function applyShopRule(){
  var s=S.sheet; if(!s||s.edit||s.kind!=='e'||s.receipt||isXferSub(s.sub)) return;
  var r=ruleFor(s.shop)||{sub:'',acc:''};
  /* the category */
  if(!s.sub||s.sub===s.autoSub){
    var sub=r.sub;
    if(sub&&(!D.subMap[sub]||isXferSub(sub))) sub='';
    /* the shop no longer matches: what the rule filled in goes again */
    if(sub!==s.sub&&(sub||s.autoSub)){
      s.sub=sub; s.main=sub?(D.subMap[sub].main||''):''; s.autoSub=sub;
      refreshCatFields();
    }
  }
  /* the card: unless you picked one yourself */
  if(!s.accPicked){
    var acc=(r.acc&&D.accMap&&D.accMap[r.acc])?r.acc:'';
    if(acc&&acc!==s.account){
      if(!s.autoAcc) s.accBefore=s.account;
      setSheetAccount(acc); s.autoAcc=acc;
    }else if(!acc&&s.autoAcc&&s.account===s.autoAcc){
      setSheetAccount(s.accBefore||s.account); s.autoAcc=''; s.accBefore='';
    }
  }
  updateCbHint();
}
/* the account field, changed from code: the amount's currency follows */
function setSheetAccount(name){
  var s=S.sheet; if(!s||!name) return;
  s.account=name;
  var el=document.getElementById('f_acc'); if(el) el.innerHTML=accFieldInner(name);
  updateAmt();
}
function drawShopRules(){
  var m=shopRules(), names=Object.keys(m).sort(function(a,b){ return a.localeCompare(b); });
  var h=sheetTop('Shop rules','','backToSettings()');
  h+='<p class="tiny" style="margin:0 4px 12px;line-height:1.45">Type a shop that has a rule and its category and card are filled in. You can still pick others for that record.</p>';
  h+='<div class="glass" style="padding:4px 0">'+(names.length?names.map(function(n){
      var r=ruleParts(m[n]), bits=[];
      if(r.sub) bits.push(strip(r.sub)+(D.subMap[r.sub]?'':' (not in Setup any more)'));
      if(r.acc) bits.push(strip(r.acc)+(D.accMap[r.acc]?'':' (no such account now)'));
      return navRow(esc(n),'→ '+bits.join(' · '),'openShopRule('+q(n)+')');
    }).join(''):'<div class="empty" style="padding:14px 18px">No rules yet.</div>')+
    '<button class="expadd" style="color:'+ACCENT+'" onclick="openShopRule(\'\')">+ Add rule</button></div>';
  var sug=ruleSuggestions();
  if(sug.length) h+='<div class="sect" style="margin-top:18px"><span>You always file these the same way</span></div><div class="glass" style="padding:4px 0">'+
    sug.slice(0,8).map(function(x){
      return '<div class="setrow"><span class="setmain"><b>'+esc(x.shop)+'</b><i>'+esc(strip(x.sub))+(x.acc?' · '+esc(strip(x.acc)):'')+' · '+x.n+' times</i></span>'+
        '<button class="unlinkb" onclick="addRule('+q(x.shop)+','+q(x.sub)+','+q(x.acc)+')">Add rule</button></div>';
    }).join('')+'</div>';
  h+=sheetEnd();
  document.getElementById('modal').innerHTML=h;
}
function ruleSuggestions(){
  var have={};
  Object.keys(shopRules()).forEach(function(k){ have[shopStrict(k)]=1; });
  var by={}, from=addDaysIso(D.today,-365);
  (D.tx||[]).forEach(function(t){
    if(t.k!=='e'||!t.shop||!t.sub||t.date<from||isXferSub(t.sub)||isCorrName(t.sub)||isLine(t)||t.sched) return;
    shopParts(t.shop).forEach(function(nm){
      var k=shopStrict(nm); if(!k||have[k]) return;
      var b=by[k]||(by[k]={shop:nm,subs:{},accs:{},n:0});
      b.n++; b.subs[t.sub]=(b.subs[t.sub]||0)+1; b.accs[t.account]=1;
    });
  });
  var out=[];
  /* one category every time - and the card too, when it was always the same one */
  Object.keys(by).forEach(function(k){
    var b=by[k], ss=Object.keys(b.subs), aa=Object.keys(b.accs);
    if(b.n>=3&&ss.length===1) out.push({shop:b.shop,sub:ss[0],acc:(aa.length===1&&D.accMap[aa[0]])?aa[0]:'',n:b.n});
  });
  return out.sort(function(a,b){ return b.n-a.n; });
}
function putRule(shop,sub,orig,acc){
  var m=shopRules(), n={}, key=shopStrict(shop);
  for(var k in m) if(m.hasOwnProperty(k)&&k!==orig&&shopStrict(k)!==key) n[k]=m[k];
  if(sub||acc) n[shop]=acc?{sub:sub||'',acc:acc}:sub;
  setPref('shopCat',n);
}
function addRule(shop,sub,acc){ putRule(shop,sub,'',acc||''); drawShopRules(); toast(shop+' → '+strip(sub)+(acc?' · '+strip(acc):'')); }
function openShopRule(name){

function drawShopRule(){

    fRow('Category','<select class="tinput fin" onchange="S.ruleD.sub=this.value">'+

    fRow('Account','<select class="tinput fin" onchange="S.ruleD.acc=this.value">'+opt('','Keep what I pick',!d.acc)+
      (D.accounts||[]).map(function(a){ return opt(a.name,strip(a.name),a.name===d.acc); }).join('')+'</select>')+
    '</div><div class="shopchips" id="rulechips"></div>';
  if(d.orig) h+='<button class="delbtn" onclick="dropShopRule()">Delete rule</button>';
  h+=sheetEnd();

function ruleChips(){
  var box=document.getElementById('rulechips'); if(!box||!S.ruleD) return;
  var v=String(S.ruleD.shop||'').trim(), list=v?shopMatches(v,6):recentShops(6), c=shopStrict(v);
  box.innerHTML=list.map(function(x){
    return '<button class="shopchip'+(c&&shopStrict(x)===c?' on':'')+'" onclick="ruleShop('+q(x)+')">'+esc(x)+'</button>';
  }).join('');
}
function ruleShop(x){ if(!S.ruleD) return; S.ruleD.shop=x; var el=document.getElementById('rule_shop'); if(el) el.value=x; ruleChips(); }
function saveShopRule(){
  var d=S.ruleD; if(!d) return;
  var shop=String(d.shop||'').replace(/\s+/g,' ').trim().slice(0,80);
  if(!shop){ toast('Type the shop'); return; }
  if(!d.sub&&!d.acc){ toast('Pick a category, an account or both'); return; }
  if(d.sub&&!D.subMap[d.sub]){ toast('Pick a category'); return; }

/* ══════ savings goals ═════════════════════════════════════════════════════
   "New laptop, 60 000", filled the way a project is: a Savings transfer is
   put towards one - picked right under its category, or later with the
   Project button in Activity - and the goal adds up what went in. It is a
   mark on the record (g:Name), the way a project is (p:Name). The goal's own
   numbers - the target, a date, whatever was saved before the app counted
   it - are kept with the app's settings. */
var SAVE_RE=/savings?\s*(transfer|jar|deposit)|to\s+savings|заощадж|накопич|сбереж|копилк|скарбничк/i;
function isSavingsSub(n){ return SAVE_RE.test(strip(n||'')); }
function goalsList(){ var g=pref('goals',[]); return (g instanceof Array)?g:[]; }
function goalsOf(t){ return allFlags(t).filter(function(k){ return k.slice(0,2)==='g:'; }).map(function(k){ return k.slice(2); }); }
function goalOfFlags(f){ var g=(f||[]).filter(function(k){ return String(k).slice(0,2)==='g:'; })[0]; return g?String(g).slice(2):''; }
function goalRecords(name){
  return txAll().filter(function(t){ return t.k==='e'&&goalsOf(t).indexOf(name)>-1; });
}
/* what was saved before the app counted it ("saved" in the first version) */
function goalStart(g){ return Math.max(0,Number(g.start!==undefined?g.start:g.saved)||0); }
function goalSaved(g){
  return goalStart(g)+sum(goalRecords(g.name),function(t){ return Math.abs(Number(t.uah)||0); });
}
function goalCard(g){
  var saved=goalSaved(g), target=Math.max(0,Number(g.target)||0), p=target?Math.min(100,saved/target*100):0;
  var left=Math.max(0,target-saved), bits=[], n=goalRecords(g.name).length;
  if(!target) bits.push('Set a target');
  else if(left<0.005) bits.push('Reached — well done');
  else{
    bits.push(bmoney(left,0)+' to go');
    if(g.due){
      var dd=parseD(g.due), now=parseD(D.today);
      var months=(dd.getFullYear()-now.getFullYear())*12+(dd.getMonth()-now.getMonth())+(dd.getDate()>=now.getDate()?0:-1);
      if(dd<now) bits.push('was due '+fmtShort(g.due));
      else if(months<1) bits.push('by '+fmtShort(g.due));
      else bits.push(bmoney(left/months,0)+' a month until '+MONS[dd.getMonth()]+' '+dd.getFullYear());
    }
  }
  var hue=hueOf(g.name||'goal');
  return '<button class="glass goal" onclick="openGoal('+q(g.id)+')">'+
    '<div class="gtop">'+icBadge(icKey(g.name,'',1)==='tag'?'piggy':icKey(g.name,'',1),hue,'sm')+
      '<span class="gname">'+esc(g.name)+'</span><span class="gpct">'+(target?(anyHidden()?DOTS:Math.floor(p)+'%'):'')+'</span></div>'+
    '<div class="track lg" style="margin-top:11px">'+barFill(p,g.name||'goal')+'</div>'+
    '<div class="gmeta"><span>'+bmoney(saved,0)+(target?' of '+bmoney(target,0):'')+
      (n?' · '+n+' transfer'+(n===1?'':'s'):'')+'</span><span>'+esc(bits.join(' · '))+'</span></div>'+
    '</button>';
}
function goalsSection(){
  var l=goalsList();
  var h='<div class="sect"><span>'+inIc('Savings','',null)+'Savings goals</span>'+
    '<button class="sectadd" onclick="openGoal(\'\')">+ Goal</button></div>';
  if(!l.length) return h+'<button class="glass goalnew" onclick="openGoal(\'\')">Set a goal, then put Savings transfers towards it</button>';
  return h+l.map(goalCard).join('');
}
/* ---- in the add sheet: right under the category, once it is Savings transfer */
function goalField(s,fn){
  if(!s||s.kind!=='e'||s.receipt||!isSavingsSub(s.sub)||apiV()<3) return '';
  var l=goalsList(), cur=goalOfFlags(s.flags);

  });

function dropGoalFlags(f){ return (f||[]).filter(function(k){ return String(k).slice(0,2)!=='g:'; }); }

function allSavings(items){ return items.length>0&&items.every(function(t){ return t.k==='e'&&isSavingsSub(t.sub)&&!isReceipt(t); }); }

function goalPickHtml(P){

function newGoalGo(){

function goalPick(n){

function addToGoal(items,n){
  var tag='g:'+n, touched=[], del=[];

  S.sel=null; S.selDel=0; render(true);

  if(del.length) p.flagDel=del;

/* ---- the goal's own page ----------------------------------------------- */
function openGoal(id){

/* ================================================================ RECEIPTS
   One payment covering several categories. The row you see is the receipt;
   what is under it is what you have split out so far. The receipt row itself
   carries whatever is still unaccounted for, which is why the day total is
   right from the moment you enter it and never moves as you fill it in. */
function isReceipt(t){ return !!t && t.k==='e' && !!t.receipt && t.rtotal!==null && t.rtotal!==undefined; }
function isLine(t){ return !!t && t.k==='e' && !!t.receipt && (t.rtotal===null||t.rtotal===undefined); }
function linesOf(id){
  var out=(D.tx||[]).filter(function(x){ return isLine(x) && x.receipt===id; });
  /* a receipt from before the last two years keeps its lines there too */
  if(S.older&&S.older.length) S.older.forEach(function(x){
    if(isLine(x)&&x.receipt===id&&!S.pendingDel[delKey(x)]) out.push(x);
  });
  return out;
}
function receiptLeft(t){
  var spent=0, p=Math.pow(10,decOf(t.currency||'UAH'));
  linesOf(t.receipt).forEach(function(x){ spent+=Math.abs(Number(x.amount)||0); });
  return Math.round(((Number(t.rtotal)||0)-spent)*p)/p;
}
/* every line is drawn inside its receipt, so it must not also sit loose in the
   day list - the same rule transfers follow */
/* A line is folded into its receipt only when the receipt is on screen with
   it. Filter the list down to one category and the receipt itself drops out
   (it has no category), so its lines must stand on their own instead of
   vanishing along with it. */
function receiptHidden(items){
  var heads={};
  items.forEach(function(t){ if(isReceipt(t)) heads[t.receipt]=1; });
  return items.filter(function(t){ return isLine(t)&&heads[t.receipt]; });
}
/* what the whole payment came to: what is still unsplit plus everything
   already split out of it - both already converted, so currencies mix safely */
function receiptUah(t){
  /* the parent's share is signed: on an over-filled receipt it is negative,
     and taking it as an absolute would count the overshoot twice instead of
     letting it cancel back down to what was actually paid. A refunded or
     owed part is not money spent, so it is left out. */
  var v=outOfStats(t)?0:txAmount(t);
  linesOf(t.receipt).forEach(function(x){ if(!outOfStats(x)) v+=Math.abs(txAmount(x)); });
  return Math.abs(v);
}
/* what a row adds to a total - nothing, when it is refunded or owed */
function rowUah(t){ return isReceipt(t)?receiptUah(t):(outOfStats(t)?0:Math.abs(txAmount(t))); }

function intoRcpWhy(head,items){

     are - into a receipt, or back out of one - so it is named. */
  var back=selReceipts();
  var why=back?selUnreceiptWhy():selMergeWhy();
  var pwhy=apiV()<3?'':selProjectWhy();
  return '<div class="selbar"><div class="selrow">'+
    '<span class="selwrapb">'+
      '<button class="dupb" onclick="selDup()" aria-label="Start a copy of it">'+COPY_ICON+'</button>'+
      '<button class="selrb" onclick="selEdit()" aria-label="Edit what is selected">'+PENCIL_ICON+'</button>'+
    '</span>'+
    /* what makes a new thing out of the picked records sits in the middle:
       a project above, a receipt (or back out of one) below */
    '<span class="selmid">'+
      '<button class="projb'+(pwhy?' off':'')+'" onclick="'+
        (pwhy?"toast('"+pwhy.replace(/'/g,"\\'")+"')":'selProject()')+'">'+svgIc('folder',16,2)+'Project</button>'+
      '<button class="selpill'+(why?' off':'')+'" onclick="'+
        (why?"toast('"+why.replace(/'/g,"\\'")+"')":(back?'selUnreceipt()':'selMerge()'))+'">'+
        (back?'Expense':'Receipt')+'</button>'+
    '</span>'+
    '<button class="selrb danger'+(S.selDel?' armed':'')+'" onclick="selDelete()"'+
      ' aria-label="Delete what is selected">'+TRASH_ICON+'</button>'+
  '</div></div>';
}

function selDelete(){
  if(!S.selDel){
    S.selDel=1; render(true);
    toast('Tap again to delete '+S.sel.length+' record'+(S.sel.length===1?'':'s'));
    setTimeout(function(){ if(S.selDel){ S.selDel=0; render(true); } },3200);
    return;
  }
  var list=selItems(); if(!list.length){ selClear(); return; }
  if(list.some(function(t){ return t.pending; })){ toast('Wait a moment — some of them are still saving'); return; }
  holdDelete(list,'deleteMany',{items:list.map(txRef)},
    list.length===1?'Deleted':('Deleted '+list.length+' records'));
}

function selMerge(){
  var it=selItems(), heads=it.filter(isReceipt);
  if(heads.length===1){ openIntoReceipt(heads[0],it); return; }
  var items=selPayload();
  S.sel=null; S.selDel=0;
  render(true); toast('Making a receipt…');
  bg('mergeIntoReceipt',{items:items, id:newId(), receipt:newReceiptId()});
}

/* ── editing what is picked ────────────────────────────────────────────
   One record edits as itself, in the sheet it would open anyway. Several
   share one panel of only the fields that mean the same thing on all of
   them, and each field left alone is left alone. */
function selEdit(){
  var it=selItems();
  if(!it.length) return;
  if(it.length===1){
    var t=it[0];
    S.sel=null; S.selDel=0;
    /* the list was drawn in picking mode and it is not any more, so it has to
       be redrawn before the sheet goes over the top of it - otherwise it sits
       there still showing ticks, with every row wired to a selTap that now
       does nothing */
    render(true);
    openSheet(t.k,t);
    return;
  }
  S.multi={date:'',sub:'',account:'',shop:'',trip:'__keep'};
  drawMulti();
}
function multiHasExp(){
  return selItems().some(function(t){ return selPlainExp(t)||isReceipt(t); });
}
function multiHasCat(){
  return selItems().some(selPlainExp);
}
function drawMulti(){
  var d=S.multi, n=S.sel.length;
  var h=sheetTop('Edit '+n+' records','saveMulti()');
  h+='<p class="tiny" style="margin:0 0 12px">Anything you leave blank stays as it is.</p>';
  h+='<div class="glass" style="padding:2px 0">'+
    fRow('Date','<input type="date" class="tinput fin" value="'+esc(d.date)+'" onchange="S.multi.date=this.value">')+
    fRow('Account','<select class="tinput fin" onchange="S.multi.account=this.value;drawMulti()">'+
      opt('','Keep as they are',!d.account)+
      (D.accounts||[]).map(function(a){ return opt(a.name,strip(a.name),a.name===d.account); }).join('')+
      '</select>')+
    /* subOptions carries its own 'Choose\u2026' placeholder, and a second empty
       option would win the selection - so only its real entries are used */
    (multiHasCat()?fRow('Category','<select class="tinput fin" onchange="S.multi.sub=this.value">'+
      opt('','Keep as they are',!d.sub)+
      subOptions('',d.sub).replace(opt('','Choose subcategory\u2026',!d.sub),'')+
      '</select>'):'')+
    (multiHasExp()?fRow('Shop','<input class="tinput fin" placeholder="Keep as it is" value="'+esc(d.shop)+'" oninput="S.multi.shop=this.value">'):'')+
    (tripNames().length?fRow('Trip','<select class="tinput fin" onchange="S.multi.trip=this.value">'+
      opt('__keep','Keep as they are',!d.trip||d.trip==='__keep')+
      opt('__none','Not in a trip',d.trip==='__none')+
      tripNames().map(function(n){ return opt(n,n,d.trip===n); }).join('')+
      '</select>'):'')+
    '</div>';
  /* moving money between currencies changes the number, not the value */
  if(d.account){
    var nc=currencyOf(d.account), other={};
    selItems().forEach(function(t){ var c=t.currency||'UAH'; if(c!==nc) other[c]=1; });
    var oc=Object.keys(other);
    if(oc.length) h+='<p class="tiny" style="margin:10px 4px 0">Amounts in '+esc(oc.join(', '))+' will be converted to '+esc(nc)+' at each record’s own rate, so what they are worth stays the same.</p>';
  }
  h+=sheetEnd();
  document.getElementById('modal').innerHTML=h;
}
function saveMulti(){
  var d=S.multi||{};
  var p={items:selPayload()};
  if(d.date) p.date=d.date;
  if(d.sub) p.sub=d.sub;
  if(d.account){ p.account=d.account; p.currency=currencyOf(d.account); }
  if(shopNorm(d.shop)) p.shop=shopNorm(d.shop);
  if(d.trip&&d.trip!=='__keep') p.trip=d.trip==='__none'?'':d.trip;
  if(!p.date&&!p.sub&&!p.account&&!p.shop&&p.trip===undefined){ toast('Nothing to change'); return; }
  var n=p.items.length;
  /* the trip shows at once; everything else waits for the sheet */
  if(p.trip!==undefined) selItems().forEach(function(t){ t.trip=p.trip; });
  closeModal(); S.sel=null; S.selDel=0; S.multi=null; render(true);
  toast('Updating '+n+'…');
  bg('editMany',p);
}


/* ══════ quick actions ═════════════════════════════════════════════════
   The records you enter over and over, one tap each. A name is only a label
   for the button: nothing about it reaches the spreadsheet, so a quick
   action lands in Activity as an ordinary expense or income. Leave it
   unnamed and the button shows the record itself, which is usually clearer
   than a name would be. */
function quickList(){ return (D.quick||[]).slice(); }
function quickById(id){
  var L=quickList();
  for(var i=0;i<L.length;i++) if(L[i].id===id) return L[i];
  return null;
}
function newQuickId(){ return 'q'+Date.now().toString(36)+Math.floor(Math.random()*46656).toString(36); }
function quickKey(a){ return a.kind==='i'?(a.source||''):(a.sub||a.main||''); }
/* A quick action is a template, and a blank field is a deliberate part of
   it: what you leave out is what you get asked for, every time you tap it.
   An account that has been renamed or deleted since counts as blank too -
   asking is more use than refusing. */
function quickMissing(a){
  var out=[];
  if(!(Number(a.amount)||0)) out.push('amount');
  if(!a.account||!(D.accMap&&D.accMap[a.account])) out.push('account');
  if(a.kind==='i'?!a.source:!a.sub) out.push('cat');
  /* a transfer also needs somewhere to go */
  if(quickIsXfer(a)&&!(a.to&&D.accMap&&D.accMap[a.to]&&a.to!==a.account)) out.push('to');
  return out;
}
function quickIsXfer(a){ return !!a&&a.kind!=='i'&&isXferSub(a.sub); }
/* one field of the quick action screens: the label above, the control the
   whole width under it - on a phone nothing then sits on top of anything */
function qfield(label,control,select){
  return '<div class="fieldlabel">'+label+'</div>'+
    (select?'<div class="selwrap">'+control+'<span class="chev">\u25BC</span></div>':control);
}
function qaccOptions(cur,blank,except){
  return opt('',blank,!cur)+(D.accounts||[]).filter(function(x){ return !except||x.name!==except||x.name===cur; })
    .map(function(x){ return opt(x.name,strip(x.name),x.name===cur); }).join('');
}

function openQuick(){ S.qsel=null; drawQuick(); }
function drawQuick(){
  var L=quickList();
  var h=sheetTop('Quick actions','');
  h+='<div class="qlist">'+L.map(function(a){ return quickRow(a); }).join('')+
     '<button class="row qnew qcard" onclick="openQuickEdit(\'\')">'+
       '<span class="qnewic">+</span>'+
       '<span class="rmain"><span class="rtitle" style="display:block">New quick action</span></span>'+
     '</button></div>';
  if(!L.length) h+='<p class="tiny qhint">A quick action is one record you add a lot — the same amount, category and account every time.</p>';
  else if(!S.qsel) h+='<p class="tiny qhint">Tap to add it · hold to edit or delete · swipe right to change the account or date once</p>';
  if(S.qsel) h+='<div class="qbar">'+
    '<button class="qbtn" onclick="openQuickEdit('+q(S.qsel)+')">'+PENCIL_ICON+'<span>Edit</span></button>'+
    '<button class="qbtn danger'+(S.qdel===S.qsel?' armed':'')+'" onclick="deleteQuick('+q(S.qsel)+')">'+
      TRASH_ICON+'<span>'+(S.qdel===S.qsel?'Sure?':'Delete')+'</span></button>'+
    '</div>';
  h+=sheetEnd();
  document.getElementById('modal').innerHTML=h;
}
function quickRow(a){
  var e=a.kind!=='i', sel=S.qsel===a.id, xf=quickIsXfer(a);
  var key=quickKey(a);
  var to=(xf&&a.to&&D.accMap&&D.accMap[a.to])?a.to:'';
  var title=a.name?strip(a.name):(xf?(to?'To '+strip(to):'Transfer'):(strip(key)||(e?'New expense':'New income')));
  var miss=quickMissing(a);
  /* when something is missing, that is the fact worth reading, so the shop
     steps aside rather than pushing the hint off the end of the line */
  var bits=[];
  if(a.name&&key&&!xf) bits.push(strip(key));
  if(a.name&&to) bits.push('to '+strip(to));
  if(e&&!xf&&a.shop&&!miss.length) bits.push(a.shop);
  if(a.account&&D.accMap&&D.accMap[a.account]&&miss.indexOf('account')<0) bits.push((xf?'from ':'')+strip(a.account));
  if(xf&&Number(a.fee)>0) bits.push('fee '+money(Number(a.fee)));
  if(miss.length) bits.push('asks each time');
  /* a transfer gains and loses nothing, so it carries no sign */
  var amt=(Number(a.amount)||0)?((xf?'':(e?'−':'+'))+money(Math.abs(Number(a.amount)))):'—';
  return '<button class="row qrow qsw qcard'+(sel?' selon':'')+'" data-qk="'+esc(a.id)+'"'+
    ' onclick="fireQuick('+q(a.id)+')">'+
    '<span class="qswp">'+SLIDER_ICON+'</span>'+
    (xf?icBadge('transfer',hueOf(a.main||'Transfer')):(e?catBadge(key,a.main||(D.subMap&&D.subMap[key]||{}).main):srcBadge(key)))+
    '<span class="rmain"><span class="rtitle">'+esc(title)+'</span>'+
      (bits.length?'<span class="rmeta">'+esc(bits.join(' · '))+'</span>':'')+'</span>'+
    '<span class="ramt" style="color:'+(xf?'rgba(25,23,19,.55)':(e?'#191713':GREEN))+'">'+amt+'</span></button>';
}

/* Writing the record is the same wherever it came from - a plain tap, the
   swipe panel, or the panel that asks for what the action left blank. An
   override belongs to this one record; the quick action is never touched. */
/* A transfer that cannot be written in one go - nowhere to go, or no
   transfer category in the sheet - opens the transfer form with everything
   the action knows filled in, instead of writing half of it. */
function quickAsXfer(a,over){
  over=over||{};
  closeModal(); S.qsel=null; S.qonce=null;
  openSheet('e');
  var s=S.sheet; if(!s) return;
  var acct=over.account||a.account;
  if(acct&&D.accMap&&D.accMap[acct]) s.account=acct;
  var amt=Number(over.amount!==undefined&&over.amount!==''?String(over.amount).replace(',','.'):a.amount)||0;
  if(amt) s.amount=numStr(amt);
  var sub=(over.sub!==undefined&&over.sub!=='')?over.sub:(a.sub||'');
  s.sub=sub; s.main=(D.subMap[sub]||{}).main||''; s.note=a.note||''; s.trip='';
  if(over.date) s.date=over.date;
  var to=over.to||a.to||a.shop||'';
  s.toAccount=(to&&D.accMap&&D.accMap[to]&&to!==s.account)?to:(isAtmName(sub)?cashAccountFor(s.account):'');
  if(Number(a.fee)>0) s.fee=numStr(Number(a.fee));
  drawSheet();
}
function writeQuick(a,over){
  over=over||{};
  var acct=over.account||a.account;
  var date=over.date||D.today;
  var raw=(over.amount!==undefined&&over.amount!=='')?over.amount:a.amount;
  var amt=amtOf(String(raw==null?'':raw),decOf(currencyOf(acct)||'UAH'));
  var sub=over.sub!==undefined&&over.sub!==''?over.sub:(a.sub||'');
  var src=over.source!==undefined&&over.source!==''?over.source:(a.source||'');
  if(!amt){ toast('Enter an amount'); return false; }
  if(!acct||!(D.accMap&&D.accMap[acct])){ toast('Pick an account'); return false; }
  if(a.kind==='i'?!src:!sub){ toast(a.kind==='i'?'Pick a source':'Pick a category'); return false; }
  if(a.kind==='e'&&isXferSub(sub)) return writeQuickXfer(a,over,acct,amt,date,sub);
  var cur=currencyOf(acct);
  var main=(D.subMap[sub]||{}).main||a.main||'';
  /* a Savings transfer goes towards the goal the action names */
  var flags=(a.kind==='e'&&a.goal&&isSavingsSub(sub)&&apiV()>=3)?['g:'+a.goal]:[];
  var f={kind:a.kind, amount:String(amt), account:acct, date:date,
         main:main, sub:sub, source:src, shop:a.shop||'', note:a.note||'', id:newId(), flags:flags,
         trip:a.kind==='e'?tripName():''};
  var cid='p'+(++S.cid);
  var payload={kind:a.kind, id:f.id, trip:f.trip, row:0, was:{date:'',amount:0,account:''},
    date:date, amount:amt, currency:cur, account:acct,
    main:main, sub:sub, source:src, shop:f.shop, note:f.note, flags:flags};
  var row=localTx(f,cur,cid);
  S.pending[cid]=row; D.tx.push(row);
  closeModal(); S.qsel=null; S.qonce=null; prep(); render(false);
  toast((a.name?strip(a.name):strip(sub||src||''))+' · '+curMoney(amt,cur)+' added');
  bg('addTx',payload,function(){ delete S.pending[cid]; },function(){
    D.tx=D.tx.filter(function(x){ return x.cid!==cid; });
  });
  return true;
}
/* A transfer from a quick action: both halves at once, the way the form
   writes them - in another currency at the rate in Setup - and its fee,
   when the action has one, as its own expense just under it. */
function writeQuickXfer(a,over,acct,amt,date,sub){
  var to=over.to||a.to||'';
  var words=xferWords(acct,to);
  if(!to||!(D.accMap&&D.accMap[to])||to===acct||!words.sub||!words.src){ quickAsXfer(a,over); return true; }
  var cur=currencyOf(acct)||'UAH', toCur=currencyOf(to)||'UAH', toAmt=amt;
  if(toCur!==cur){ var pp=Math.pow(10,decOf(toCur)); toAmt=Math.round(amt*rateOf(cur)/(rateOf(toCur)||1)*pp)/pp; }
  var main=(D.subMap[words.sub]||{}).main||'';
  var fee=Number(a.fee)||0, feeSub=feeSubName();
  if(!(fee>0&&feeSub&&apiV()>=3)) fee=0;
  var id=newId(), feeNote=words.atm?'ATM fee':'Transfer fee';
  var payload={kind:'e', id:id, row:0, was:{date:'',amount:0,account:''}, date:date, amount:amt, currency:cur,
    account:acct, main:main, sub:words.sub, source:'', shop:to, note:a.note||'', flags:[],
    sched:'', trip:'', to:to, toCurrency:toCur, toAmount:toAmt, inSource:words.src};
  if(fee){ payload.fee=fee; payload.feeSub=feeSub; payload.feeNote=feeNote; payload.feeTrip=tripName()||''; }
  var sh={kind:'e', id:id, date:date, amount:String(amt), account:acct, main:main, sub:words.sub, shop:to, note:a.note||'', flags:[], trip:''};
  var cid='p'+(++S.cid), row=localTx(sh,cur,cid), fcid='';
  S.pending[cid]=row; D.tx.push(row);
  if(fee){ fcid='p'+(++S.cid); var fr=feeLocal(sh,fee,cur,id,fcid,feeNote,payload.feeTrip); S.pending[fcid]=fr; D.tx.push(fr); }
  closeModal(); S.qsel=null; S.qonce=null; prep(); render(false);
  toast((a.name?strip(a.name):'To '+strip(to))+' · '+curMoney(amt,cur)+(fee?', fee added':'')+' — transferred');
  bg('addTransfer',payload,function(){ delete S.pending[cid]; if(fcid) delete S.pending[fcid]; },function(){
    D.tx=D.tx.filter(function(x){ return x.cid!==cid&&(!fcid||x.cid!==fcid); });
  });
  return true;
}
function fireQuick(id){
  var a=quickById(id); if(!a) return;
  if(S.qsel){ S.qsel=null; drawQuick(); return; }
  var miss=quickMissing(a);
  /* whatever the action left blank is asked for now, and only that */
  if(miss.length){ openQuickAsk(id,miss); return; }
  writeQuick(a,null);
}

/* The editor asks for everything the record needs plus one optional name.
   Blank name is the normal case, not an omission - the row then shows the
   record, which is what it will look like in Activity anyway. Whatever the
   category brings with it in the add sheet it brings here too: a transfer
   asks where the money goes and its fee, a Savings transfer its goal. */
function openQuickEdit(id){
  var a=id?quickById(id):null;
  S.qedit=a?{id:a.id,name:a.name||'',kind:a.kind||'e',amount:String(a.amount||''),
             account:a.account||'',sub:a.sub||'',source:a.source||'',shop:a.shop||'',note:a.note||'',
             to:a.to||(quickIsXfer(a)&&D.accMap&&D.accMap[a.shop]?a.shop:''),fee:a.fee?String(a.fee):'',goal:a.goal||''}
          :{id:'',name:'',kind:'e',amount:'',account:lastAccount('e')||defaultAccount(),
             sub:'',source:'',shop:'',note:'',to:'',fee:'',goal:''};
  drawQuickEdit();
}
function qset(k,v){ if(S.qedit) S.qedit[k]=v; }
function qsetKind(v){
  var d=S.qedit; if(!d||d.kind===v) return;
  d.kind=v;
  if(v==='i'){ d.sub=''; d.shop=''; d.to=''; d.fee=''; d.goal=''; if(!d.account) d.account=lastAccount('i')||defaultAccount(); }
  else { d.source=''; }
  drawQuickEdit();
}
/* the category decides which of the extra fields show, so the screen is
   drawn again - the typed fields are all kept in S.qedit */
function qsetSub(v){
  var d=S.qedit; if(!d) return;
  var was=isXferSub(d.sub)+'|'+isSavingsSub(d.sub);
  d.sub=v;
  if(!isXferSub(v)){ d.to=''; d.fee=''; }
  if(!isSavingsSub(v)) d.goal='';
  if(was!==isXferSub(v)+'|'+isSavingsSub(v)) drawQuickEdit();
}
function qsetAcc(v){
  var d=S.qedit; if(!d) return;
  d.account=v;
  if(isXferSub(d.sub)){ if(d.to===v) d.to=''; drawQuickEdit(); }
}
function drawQuickEdit(){
  var d=S.qedit;
  var inc=d.kind==='i', xf=!inc&&isXferSub(d.sub), sav=!inc&&!xf&&isSavingsSub(d.sub)&&apiV()>=3;
  var h=sheetTop(d.id?'Edit quick action':'New quick action','saveQuickEdit()','drawQuick()');
  h+='<div class="stabs qtabs">'+
    '<button class="stab'+(inc?'':' on')+'" onclick="qsetKind(\'e\')">Expense</button>'+
    '<button class="stab'+(inc?' on':'')+'" onclick="qsetKind(\'i\')">Income</button></div>';
  h+='<p class="tiny qtip">Leave a field blank and it asks you for it each time you tap the action.</p>';
  h+='<div class="qform">';
  h+=qfield('Name <span class="opt">optional</span>','<input class="tinput" placeholder="Shown on the button" value="'+esc(d.name)+'" oninput="qset(\'name\',this.value)">');
  h+=qfield('Amount','<input class="tinput" inputmode="decimal" placeholder="Ask each time" value="'+esc(d.amount)+'" oninput="qset(\'amount\',this.value)">');
  h+=qfield(inc?'Source':'Category', inc
      ? '<select class="tinput sel" onchange="qset(\'source\',this.value)">'+
          opt('','Ask each time',!d.source)+
          (D.setup.incomeSources||[]).filter(function(x){ return !isCorrName(x.name)||x.name===d.source; })
            .map(function(x){ return opt(x.name,x.name,x.name===d.source); }).join('')+'</select>'
      : '<select class="tinput sel" onchange="qsetSub(this.value)">'+
          opt('','Ask each time',!d.sub)+
          subOptions('',d.sub).replace(opt('','Choose subcategory…',!d.sub),'')+'</select>', true);
  h+=qfield(xf?'From account':'Account','<select class="tinput sel" onchange="qsetAcc(this.value)">'+qaccOptions(d.account,'Ask each time')+'</select>',true);
  if(xf){
    h+=qfield('To account','<select class="tinput sel" onchange="qset(\'to\',this.value)">'+qaccOptions(d.to,'Ask each time',d.account)+'</select>',true);
    if(d.to&&d.account&&currencyOf(d.to)!==currencyOf(d.account))
      h+='<p class="tiny qnote">It arrives in '+esc(currencyOf(d.to))+' at the rate in Setup.</p>';
    if(feeSubName()&&apiV()>=3)
      h+=qfield((d.to&&isCashAcc(d.to)&&!isCashAcc(d.account)?'ATM fee':'Fee')+' <span class="opt">optional</span>',
        '<input class="tinput" inputmode="decimal" placeholder="None" value="'+esc(d.fee)+'" oninput="qset(\'fee\',this.value)">');
  }
  if(sav){
    var gl=goalsList().map(function(g){ return g.name; });
    if(d.goal&&gl.indexOf(d.goal)<0) gl.push(d.goal);
    if(gl.length) h+=qfield('Saving goal <span class="opt">optional</span>','<select class="tinput sel" onchange="qset(\'goal\',this.value)">'+
      opt('','No goal',!d.goal)+gl.map(function(n){ return opt(n,n,n===d.goal); }).join('')+'</select>',true);
  }
  if(!inc&&!xf) h+=qfield('Shop <span class="opt">optional</span>','<input class="tinput" placeholder="Where" value="'+esc(d.shop)+'" oninput="qset(\'shop\',this.value)">');
  h+=qfield('Note <span class="opt">optional</span>','<input class="tinput" placeholder="None" value="'+esc(d.note)+'" oninput="qset(\'note\',this.value)">');
  h+='</div>';
  h+='<button class="paybtn qsave" onclick="saveQuickEdit()">'+(d.id?'Save':'Add quick action')+'</button>';
  h+=sheetEnd();
  document.getElementById('modal').innerHTML=h;
}
function saveQuickEdit(){
  var d=S.qedit; if(!d) return;
  var raw=String(d.amount||'').replace(',','.').trim();
  var amt=raw?parseFloat(raw):0;

var QLP=null;

function qlpMove(e){

/* ── swipe a quick action right: add it once, with a different account or
   date. The action itself is never changed - this is one record, not an
   edit. The gesture only claims the finger once it is clearly sideways, so
   scrolling the list and the press-and-hold both still work. */
var QSW=null, QSW_OPEN=62, QSW_MAX=92;
function qswSet(row,px){ row.style.setProperty('--qsw',px+'px'); }
function qswDown(e){
  if(!e.target.closest) return;
  var row=e.target.closest('.qsw'); if(!row) return;
  QSW={row:row,x:e.clientX,y:e.clientY,dx:0,axis:0,pid:e.pointerId};
  document.addEventListener('pointermove',qswMove,{passive:false});
  document.addEventListener('pointerup',qswUp);
  document.addEventListener('pointercancel',qswUp);
}
function qswMove(e){
  var w=QSW; if(!w||e.pointerId!==w.pid) return;
  var dx=e.clientX-w.x, dy=e.clientY-w.y;
  if(!w.axis){
    if(Math.abs(dx)<7&&Math.abs(dy)<7) return;
    /* sideways and to the right, or it is a scroll and none of our business */
    if(dx<=0||Math.abs(dx)<=Math.abs(dy)*1.3){ qswUp(); return; }
    w.axis=1; w.row.classList.add('qswiping','qswmoved');
    qlpEnd();
  }
  e.preventDefault();
  /* past the opening point it gets heavy, so the edge is felt not guessed */
  w.dx=dx>QSW_OPEN?QSW_OPEN+(dx-QSW_OPEN)*0.35:dx;
  if(w.dx>QSW_MAX) w.dx=QSW_MAX;
  qswSet(w.row,w.dx);
}
function qswUp(){
  var w=QSW; QSW=null;
  document.removeEventListener('pointermove',qswMove);
  document.removeEventListener('pointerup',qswUp);
  document.removeEventListener('pointercancel',qswUp);
  if(!w||!w.axis) return;
  var row=w.row, id=row.getAttribute('data-qk'), open=w.dx>=QSW_OPEN;
  row.classList.remove('qswiping');
  row.__qsw=1;              /* the tap that ends the swipe is not a tap */
  qswSet(row,0);
  setTimeout(function(){ row.classList.remove('qswmoved'); },300);
  if(open) openQuickOnce(id);
}

/* ---- notifications -------------------------------------------------------
   The app on the Home Screen can get notifications (iPhone: iOS 16.4 or
   later). This phone makes its own signing key, signs a pass for each of the
   next four weeks and hands them to the spreadsheet, which spends one a day
   to ring the phone; opening the app tops them up. The ring carries no text:
   the service worker asks the spreadsheet what it is about and shows that,
   so nothing about your money passes through Apple's servers. No amounts. */
var DEV_KEY='budget.dev', PUSH_KEY='budget.push', VAPID_KEY='budget.vapid', CONN_CACHE='budget-conn';

function b64u(buf){

function b64uText(t){ return b64u(new TextEncoder().encode(t)); }
function unb64u(s){

/* this phone's own signing key: made once and kept here. Only its public
   half ever leaves - to the push service and the spreadsheet. */
function vapidKeys(){
  if(S.vapid) return Promise.resolve(S.vapid);
  var sc=crypto.subtle, alg={name:'ECDSA',namedCurve:'P-256'}, saved=null;
  try{ saved=JSON.parse(localStorage.getItem(VAPID_KEY)||'null'); }catch(e){}

      return Promise.all([sc.exportKey('jwk',kp.privateKey),sc.exportKey('raw',kp.publicKey)]).then(function(x){
        var pub=b64u(x[1]);
        try{ localStorage.setItem(VAPID_KEY,JSON.stringify({jwk:x[0],pub:pub})); }catch(e){}
        return {priv:kp.privateKey,pub:pub};
      });
    });
  }
  var p=(saved&&saved.jwk&&saved.pub)
    ? sc.importKey('jwk',saved.jwk,alg,false,['sign']).then(function(k){ return {priv:k,pub:saved.pub}; },make)
    : make();

/* a pass: who may ring (this app), which push service it is for, and until when */
function signJwt(v,aud,exp){

  var body=b64uText(JSON.stringify({aud:aud,exp:exp,sub:/^https:/.test(location.origin)?location.origin:'mailto:budget@example.com'}));
  return crypto.subtle.sign({name:'ECDSA',hash:{name:'SHA-256'}},v.priv,new TextEncoder().encode(head+'.'+body))

/* one for right now and one for each of the next four weeks' days - each
   ends at 04:30, well away from the 10:00 and 21:00 checks */
function jwtBatch(v,aud){
  var now=Math.floor(Date.now()/1000), d=new Date();
  d.setHours(4,30,0,0);
  var first=Math.floor(d.getTime()/1000);
  while(first<=now+600) first+=86400;
  var list=[now+23*3600];
  for(var i=0;i<28;i++) list.push(first+i*86400);
  return Promise.all(list.map(function(e){ return signJwt(v,aud,e).then(function(t){ return {e:e,t:t}; }); }))
    .then(function(a){ a.sort(function(x,y){ return x.e-y.e; }); return a; });

function askPermission(){

    if(Notification.permission!=='default'){ res(Notification.permission); return; }

function pushTurnOn(){
  var P=S.pushPrep;
  if(!P||!P.reg){ toast('Getting ready — try again in a moment'); return; }
  var b=document.getElementById('pushgo'); if(b){ b.disabled=true; b.textContent='Turning on…'; }
  /* subscribing asks the permission question itself, and it is called
     straight from the tap, with nothing awaited first - iPhone insists */
  var opts={userVisibleOnly:true,applicationServerKey:P.v.raw};
  function notAllowed(){
    return new Error(Notification.permission==='denied'
      ?'Notifications were not allowed. You can allow them in the iPhone Settings → Notifications → Budget.'
      :'Notifications were not turned on.');
  }
  (P.sub?Promise.resolve(P.sub):P.reg.pushManager.subscribe(opts).catch(function(e){
    /* a browser that wants the question asked on its own first */
    if(Notification.permission!=='default') throw (Notification.permission==='denied'?notAllowed():e);
    return askPermission().then(function(perm){
      if(perm!=='granted') throw notAllowed();
      return P.reg.pushManager.subscribe(opts);
    });
  })).then(function(sub){
    P.sub=sub;
    return pushRegister(sub,P.v);
  }).then(function(r){
    if(r&&r.triggers===false) toast('Almost there: in the spreadsheet choose Budget → Set up notifications once.',7000);
    else toast('Notifications are on');

function pushRegister(sub,v){

    return new Promise(function(res,rej){
      API.call('savePushSub',{id:devId(),endpoint:ep,pub:v.pub,jwts:jwts},function(err,r){
        if(err){
          rej(new Error(/Unknown action/.test(String(err))
            ?'The spreadsheet still runs the old script: paste the new Code.gs and update the deployment first.'
            :String(err)));

/* On every start: the phone still has the subscription the spreadsheet
   knows, and the passes reach at least two weeks ahead. */
function pushCheck(){
  var st=pushState();
  if(!st||!pushSupported()||Notification.permission!=='granted'||!connKey()) return;
  mirrorConn();
  swReady(8000).then(function(reg){
    return Promise.all([reg.pushManager.getSubscription(),vapidKeys()]).then(function(x){
      var sub=x[0], v=x[1];
      if(sub&&sameKey(sub,v.raw)&&sub.endpoint===st.ep){
        if(Number(st.until||0)-Date.now()/1000>14*86400) return;
        return jwtBatch(v,new URL(st.ep).origin).then(function(jwts){
          API.call('savePushJwts',{id:devId(),jwts:jwts},function(err){
            if(!err){ st.until=jwts[jwts.length-1].e; setPushState(st); return; }
            /* the spreadsheet no longer knows this phone: sign it up again */
            if(/NO_PUSH/.test(String(err))) pushRegister(sub,v).catch(function(){});
          });
        });
      }
      /* the phone replaced its subscription: the new one is handed over */
      var go=(sub&&sameKey(sub,v.raw))?Promise.resolve(sub):
        (sub?sub.unsubscribe():Promise.resolve()).then(function(){
          return reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:v.raw});
        });
      return go.then(function(s2){ return pushRegister(s2,v); });
    });
  }).catch(function(){});
}
