}
function shopJoin(list){ return list.join('; '); }
/* how a typed shop field is saved: each name under the spelling you kept,
   no empty or repeated ones */
function shopNorm(v){ return shopJoin(shopParts(shopParts(v).map(shopCanon).join(';'))); }
function shopStats(){
  var by={};
  txAll().forEach(function(t){
    if(t.k!=='e'||!t.shop||isLine(t)||isXferSub(t.sub)||isCorrName(t.sub)) return;
    shopParts(t.shop).forEach(function(n){
      var b=by[n]||(by[n]={name:n,n:0,last:''});
      b.n++; if(t.date>b.last) b.last=t.date;
    });
  });
  return Object.keys(by).map(function(k){ return by[k]; })
    .sort(function(a,b){ return b.n-a.n||a.name.localeCompare(b.name); });
}
function groupId(names){ return names.slice().sort().join('|'); }
/* spellings that are one shop, by the matching you picked */
function shopGroups(){
  if(!D) return [];
  var st=shopStats(), cfg=tidyCfg(), ign={}, keyOf=cfg.level==='close'?shopLoose:shopStrict;
  cfg.ignore.forEach(function(k){ ign[k]=1; });
  var byKey={}, keys=[];
  st.forEach(function(x){
    var k=keyOf(x.name); if(!k) return;
    if(!byKey[k]){ byKey[k]=[]; keys.push(k); }
    byKey[k].push(x);
  });
  if(cfg.level==='close'){
    /* one letter apart counts too, once a name is long enough to be sure */
    var par={};
    function f(k){ while(par[k]&&par[k]!==k) k=par[k]; return k; }
    keys.forEach(function(k){ par[k]=k; });
    for(var i=0;i<keys.length;i++) for(var j=i+1;j<keys.length;j++){
      var a=keys[i], b=keys[j];
      if(Math.min(a.length,b.length)>=5&&Math.abs(a.length-b.length)<=1&&shopLev(a,b)<=1){ par[f(b)]=f(a); }
    }
    var merged={}, order=[];
    keys.forEach(function(k){ var r=f(k); if(!merged[r]){ merged[r]=[]; order.push(r); } merged[r]=merged[r].concat(byKey[k]); });
    byKey=merged; keys=order;
  }
  return keys.map(function(k){
    var items=byKey[k].slice().sort(function(a,b){ return b.n-a.n||a.name.localeCompare(b.name); });
    return {id:groupId(items.map(function(x){ return x.name; })), items:items};
  }).filter(function(g){ return g.items.length>1&&!ign[g.id]; });
}
function openShops(){ S.shopQ=''; S.tidyKeep={}; S.ssel=null; drawShops(); }
function drawShops(){
  var st=shopStats(), g=shopGroups(), qv=String(S.shopQ||'').trim(), qk=shopStrict(qv);
  var list=qv?st.filter(function(x){ return shopStrict(x.name).indexOf(qk)>-1||x.name.toLowerCase().indexOf(qv.toLowerCase())>-1; }):st;
  var h=sheetTop('Shops','','shopsBack()');
  h+='<div class="glass" style="padding:4px 0">'+
    navRow('Tidy up spellings',g.length?(g.length+' shop'+(g.length===1?' is':'s are')+' written more than one way'):'Every shop has one spelling','drawTidy()')+'</div>';
  h+='<div class="fieldlabel">Rename a shop <span class="opt">'+st.length+' in your records</span></div>'+
    '<input class="tinput" id="shopq" type="search" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Find a shop" value="'+esc(qv)+'" oninput="S.shopQ=this.value;drawShopList()">';
  h+='<div class="glass" id="shoplist" style="margin-top:10px;padding:0">'+shopListHtml(list)+'</div>';
  h+='<p class="tiny" style="margin:12px 4px 0;line-height:1.45">Renaming rewrites the shop in every record, older ones included, and in your quick actions and shop rules. Hold a shop to pick several and merge them into one.</p>';
  h+=sheetEnd();
  document.getElementById('modal').innerHTML=h+shopFab();
}
function shopListHtml(list){
  if(!list.length) return '<div class="empty" style="padding:16px">No shop like that.</div>';
  var sel=!!S.ssel;
  return list.slice(0,200).map(function(x){
    var on=sel&&S.ssel.indexOf(x.name)>-1;
    return '<button class="shoprow'+(on?' on':'')+(sel?' picking':'')+'" data-hold="shop" data-sn="'+esc(x.name)+'" onclick="shopRowTap('+q(x.name)+')">'+
      (sel?'<span class="ck">'+CHECK_ICON+'</span>':'')+
      '<span class="sn">'+esc(x.name)+'</span>'+
      '<span class="sc">'+x.n+'</span>'+(sel?'':'<span class="chevr">›</span>')+'</button>';
  }).join('');
}
/* shops that are one: hold one, tap the others, Merge, say which name stays */
function shopRowTap(name){
  if(S.holdKey==='shop:'+name){ S.holdKey=null; return; }
  if(S.ssel){ shopToggle(name); return; }
  openShopEdit(name);
}
function shopToggle(name){
  if(!S.ssel) return;
  var i=S.ssel.indexOf(name);
  if(i<0) S.ssel.push(name); else S.ssel.splice(i,1);
  if(!S.ssel.length) S.ssel=null;
  shopListRedraw();
}
function shopHold(name){
  if(S.ssel){ shopToggle(name); return; }
  S.ssel=[name];
  try{ if(navigator.vibrate) navigator.vibrate(14); }catch(e){}
  shopListRedraw();
}
/* the list and the button, without redrawing the search field */
function shopListRedraw(){
  if(!document.getElementById('shoplist')){ drawShops(); return; }
  drawShopList();
  fabPaint(shopFab());
}
function shopFab(){
  if(!S.ssel) return '';
  var n=S.ssel.length;
  return '<div class="mrgfab"><button class="mfx" onclick="shopSelClear()" aria-label="Cancel">✕</button>'+
    '<button class="mfgo"'+(n<2?' disabled':'')+' onclick="shopMergeGo()">'+svgIc('merge',16,2.2)+
    (n<2?'Merge':'Merge '+n)+'</button></div>';
}
function shopSelClear(){ S.ssel=null; shopListRedraw(); }
function shopsBack(){ if(S.ssel){ shopSelClear(); return; } backToSettings(); }
function shopMergeGo(){
  var names=(S.ssel||[]).slice();
  if(names.length<2){ toast('Tap one more to merge with'); return; }
  if(apiV()<5){ toast(NEED_V5,6000); return; }
  var cnt={}; shopStats().forEach(function(x){ cnt[x.name]=x.n; });
  openPicker({title:'Keep which name?',current:S.smrg?S.smrg.into:'',
    groups:[{label:'',items:names.map(function(n){
      return {value:n,label:n,meta:recWord(cnt[n]||0),icon:'bag',hue:330};
    })}],
    apply:function(v){ S.smrg={into:v,from:names.filter(function(n){ return n!==v; })}; drawShopMerge(); }});
}
function drawShopMerge(){
  var M=S.smrg; if(!M) return;
  var cnt={}; shopStats().forEach(function(x){ cnt[x.name]=x.n; });
  var n=0; M.from.forEach(function(x){ n+=cnt[x]||0; });
  function side(name){
    return '<div class="mrgside">'+icBadge('bag',330)+'<span class="mrgn"><b>'+esc(name)+'</b><i>'+esc(recWord(cnt[name]||0))+'</i></span></div>';
  }
  var h=sheetTop('Merge shops','','shopMergeBack()');
  h+='<div class="glass mrgpair">'+M.from.map(side).join('')+'<div class="mrgarrow">'+svgIc('chevdown',16,2.4)+'</div>'+side(M.into)+'</div>';
  h+='<button class="mrgswap" onclick="shopMergeGo()">Keep another name</button>';
  h+='<div class="glass mrgsum">'+
    '<div class="mrgline"><b>'+recWord(n)+'</b> '+(n===1?'is':'are')+' renamed to “'+esc(M.into)+'”, older ones too.</div>'+
    '<div class="mrgline">Quick actions and shop rules that name '+(M.from.length===1?'it':'them')+' follow.</div>'+
    (tidyCfg().auto?'<div class="mrgline">Typed again later, '+(M.from.length===1?'that name is':'those names are')+' saved as “'+esc(M.into)+'”.</div>':'')+
    '</div>';
  h+='<button class="paybtn mrggo" style="background:linear-gradient(160deg,'+ok(.66,.13,255)+','+ok(.55,.15,255)+')" onclick="shopMergeDo()">'+
    'Merge into “'+esc(M.into)+'”</button>';
  h+=sheetEnd();
  document.getElementById('modal').innerHTML=h;
}
function shopMergeBack(){ S.smrg=null; drawShops(); }
function shopMergeDo(){
  var M=S.smrg; if(!M) return;
  if(renameShopsNow([{from:M.from,to:M.into}],'Merged into “'+M.into+'”')){ S.smrg=null; S.ssel=null; drawShops(); }
}
function drawShopList(){
  var el=document.getElementById('shoplist'); if(!el){ drawShops(); return; }
  var st=shopStats(), qv=String(S.shopQ||'').trim(), qk=shopStrict(qv);
  el.innerHTML=shopListHtml(qv?st.filter(function(x){ return shopStrict(x.name).indexOf(qk)>-1||x.name.toLowerCase().indexOf(qv.toLowerCase())>-1; }):st);
}
function shopCount(name){ var n=0; shopStats().forEach(function(x){ if(x.name===name) n=x.n; }); return n; }
function openShopEdit(name){ S.shopEd={orig:name,name:name}; drawShopEdit(); }
function drawShopEdit(){
  var d=S.shopEd; if(!d) return;
  var n=shopCount(d.orig), to=String(d.name||'').replace(/\s+/g,' ').trim();
  var other=to&&to!==d.orig?shopStats().filter(function(x){ return x.name!==d.orig&&(x.name===to||shopStrict(x.name)===shopStrict(to)); })[0]:null;
  var h=sheetTop('Rename shop','','drawShops()');
  h+='<div class="fieldlabel">Name</div><input class="tinput" id="shopname" autocomplete="off" autocorrect="off" value="'+esc(d.name)+'" oninput="S.shopEd.name=this.value;shopEdNote()">';
  h+='<p class="tiny" id="shopednote" style="margin:8px 4px 0;line-height:1.45">'+shopEdNoteText(d,n,to,other)+'</p>';
  h+='<button class="paybtn" onclick="saveShopEdit()">'+(n===1?'Rename in 1 record':'Rename in '+n+' records')+'</button>';
  h+=sheetEnd();
  document.getElementById('modal').innerHTML=h;
}
function shopEdNoteText(d,n,to,other){
  if(!to) return 'Type the new name.';
  if(to===d.orig) return 'Written '+n+' time'+(n===1?'':'s')+'.';
  if(other) return 'Merges with “'+esc(other.name)+'” ('+other.n+' record'+(other.n===1?'':'s')+'): both will be “'+esc(to)+'”.';
  return '“'+esc(d.orig)+'” becomes “'+esc(to)+'” everywhere.';
}
function shopEdNote(){
  var d=S.shopEd, el=document.getElementById('shopednote'); if(!d||!el) return;
  var to=String(d.name||'').replace(/\s+/g,' ').trim();
  var other=to&&to!==d.orig?shopStats().filter(function(x){ return x.name!==d.orig&&(x.name===to||shopStrict(x.name)===shopStrict(to)); })[0]:null;
  el.innerHTML=shopEdNoteText(d,shopCount(d.orig),to,other);
}
function saveShopEdit(){
  var d=S.shopEd; if(!d) return;
  var to=String(d.name||'').replace(/\s+/g,' ').trim().slice(0,120);
  if(!to){ toast('Type the new name'); return; }
  if(to===d.orig){ drawShops(); return; }
  var from=[d.orig];
  /* the same shop written differently is taken along to the new name */
  shopStats().forEach(function(x){ if(x.name!==d.orig&&x.name!==to&&shopStrict(x.name)===shopStrict(to)&&shopStrict(to)===shopStrict(d.orig)) from.push(x.name); });
  if(renameShopsNow([{from:from,to:to}],'Renamed to “'+to+'”')){ S.shopEd=null; drawShops(); }
}
function drawTidy(){
  var cfg=tidyCfg(), g=shopGroups(), keep=S.tidyKeep||(S.tidyKeep={});
  var h=sheetTop('Tidy up spellings','','drawShops()');
  h+='<div class="glass" style="padding:4px 0">'+
    '<div class="fieldlabel" style="margin:12px 16px 0">How alike</div>'+
    '<div class="segrow"><button class="'+(cfg.level==='letters'?'on':'')+'" onclick="setTidyLevel(\'letters\')">Same letters</button>'+
      '<button class="'+(cfg.level==='close'?'on':'')+'" onclick="setTidyLevel(\'close\')">Close spellings too</button></div>'+
    '<p class="tiny" style="margin:0 16px 10px;line-height:1.4">'+(cfg.level==='close'
      ?'Also one letter off, and и/і, doubled letters — check each group before merging.'
      :'The same name in Latin or Cyrillic, any capitals or punctuation: ATB and АТБ, Silpo and Сільпо.')+'</p>'+
    swRow('Fix new entries','A merged spelling typed again is saved under the name you kept',cfg.auto,'toggleTidyAuto()')+
    '</div>';
  if(!g.length){
    h+='<div class="glass" style="margin-top:14px"><div class="empty">Every shop has one spelling.</div></div>';
  }else{
    h+='<div class="sect" style="margin-top:18px"><span>'+g.length+' shop'+(g.length===1?'':'s')+' written more than one way</span>'+
      (g.length>1?'<button class="sectadd" onclick="mergeAllTidy()">Merge all</button>':'')+'</div>';
    h+='<p class="tiny" style="margin:0 6px 4px">Tap the spelling to keep.</p>';
    g.forEach(function(grp,gi){
      var k=keep[grp.id]||grp.items[0].name;
      h+='<div class="glass tidygrp">'+grp.items.map(function(x){
          var on=x.name===k;
          return '<button class="tidyopt'+(on?' on':'')+'" onclick="tidyPick('+gi+','+q(x.name)+')"><span class="rad"></span>'+
            '<span class="sn">'+esc(x.name)+'</span><span class="sc">'+x.n+'</span>'+(on?'<span class="keep">Keep</span>':'')+'</button>';
        }).join('')+
        '<div class="tidybtns"><button onclick="tidyIgnore('+gi+')">Not the same</button>'+
          '<button class="go" onclick="tidyMerge('+gi+')">Merge</button></div></div>';
    });
  }
  var al=Object.keys(shopAliases()).length, ig=cfg.ignore.length;
  if(al||ig){
    h+='<div class="sect" style="margin-top:18px"><span>Remembered</span></div><div class="glass" style="padding:4px 0">'+
      (al?navRow('Spellings fixed as you type',al+' remembered','drawAliases()'):'')+
      (ig?navRow('Marked as different shops',ig+' group'+(ig===1?'':'s'),'drawIgnored()'):'')+'</div>';
  }
  h+=sheetEnd();
  document.getElementById('modal').innerHTML=h;
}
function setTidyLevel(v){ setTidyCfg({level:v}); S.tidyKeep={}; drawTidy(); }
function toggleTidyAuto(){ setTidyCfg({auto:!tidyCfg().auto}); drawTidy(); }
function tidyPick(gi,name){ var g=shopGroups()[gi]; if(!g) return; S.tidyKeep[g.id]=name; drawTidy(); }
function tidyPair(g){
  var k=(S.tidyKeep||{})[g.id]||g.items[0].name;
  return {from:g.items.map(function(x){ return x.name; }).filter(function(n){ return n!==k; }), to:k};
}
function tidyMerge(gi){
  var g=shopGroups()[gi]; if(!g) return;
  var pr=tidyPair(g);
  if(renameShopsNow([pr],'Merged into “'+pr.to+'”')) drawTidy();
}
function mergeAllTidy(){
  var pairs=shopGroups().map(tidyPair);
  if(!pairs.length) return;
  if(renameShopsNow(pairs,pairs.length+' shops merged')) drawTidy();
}
function tidyIgnore(gi){
  var g=shopGroups()[gi]; if(!g) return;
  var c=tidyCfg(); setTidyCfg({ignore:c.ignore.concat([g.id]).slice(-200)});
  toast('Kept apart'); drawTidy();
}
function drawAliases(){
  var m=shopAliases(), keys=Object.keys(m).sort();
  var h=sheetTop('Fixed as you type','','drawTidy()');
  h+='<p class="tiny" style="margin:0 4px 12px;line-height:1.45">Typed like this, a shop is saved under the name on the right. Take one off to stop it.</p>';
  h+='<div class="glass" style="padding:4px 0">'+(keys.length?keys.map(function(k){
      return '<div class="setrow"><span class="setmain"><b>'+esc(k)+'</b><i>→ '+esc(m[k])+'</i></span>'+
        '<button class="unlinkb" onclick="dropAlias('+q(k)+')">Remove</button></div>';
    }).join(''):'<div class="empty">Nothing remembered.</div>')+'</div>';
  h+=sheetEnd();
  document.getElementById('modal').innerHTML=h;
}
function dropAlias(k){ var m=shopAliases(), n={}; for(var x in m) if(m.hasOwnProperty(x)&&x!==k) n[x]=m[x]; setPref('shopAlias',n); drawAliases(); }
function drawIgnored(){
  var c=tidyCfg();
  var h=sheetTop('Different shops','','drawTidy()');
  h+='<div class="glass" style="padding:4px 0">'+(c.ignore.length?c.ignore.map(function(id,i){
      return '<div class="setrow"><span class="setmain"><b>'+esc(id.split('|').join(' · '))+'</b></span>'+
        '<button class="unlinkb" onclick="unIgnore('+i+')">Show again</button></div>';
    }).join(''):'<div class="empty">None.</div>')+'</div>';
  h+=sheetEnd();
  document.getElementById('modal').innerHTML=h;
}
function unIgnore(i){ var c=tidyCfg(), l=c.ignore.slice(); l.splice(i,1); setTidyCfg({ignore:l}); drawIgnored(); }
/* the rename itself: on screen at once, then the sheet - every row, the
   quick actions and the shop rules. Remembered for new entries too. */
function renameShopsNow(pairs,msg){
  if(apiV()<5){ toast(NEED_V5,6000); return false; }
  pairs=(pairs||[]).filter(function(p){ return p&&p.to&&p.from&&p.from.length; });
  if(!pairs.length) return false;
  var map={};
  pairs.forEach(function(p){ p.from.forEach(function(f){ map[f]=p.to; }); });
  /* a record with several shops has the name changed inside it, and the
     sheet is sent that whole cell as it was and as it becomes */
  var whole={};
  function swap(v){
    if(map.hasOwnProperty(v)) return map[v];
    var parts=shopParts(v), hit=false;
    if(parts.length<2) return null;
    parts=parts.map(function(x){ if(map.hasOwnProperty(x)){ hit=true; return map[x]; } return x; });
    if(!hit) return null;
    var nv=shopJoin(shopParts(parts.join(';')));
    whole[v]=nv;
    return nv;
  }
  var touched=[];
  txAll().forEach(function(t){
    if(t.k!=='e'||isXferSub(t.sub)) return;
    var v=String(t.shop||'').trim(), nv=v?swap(v):null;
    if(nv!==null&&nv!==v){ touched.push({t:t,was:t.shop}); t.shop=nv; }
  });
  (D.quick||[]).forEach(function(a){ var v=String(a.shop||'').trim(), nv=v?swap(v):null; if(nv!==null) a.shop=nv; });
  var sent=pairs.slice();
  Object.keys(whole).forEach(function(v){ if(whole[v]!==v) sent.push({from:[v],to:whole[v]}); });
  if(tidyCfg().auto){
    var al=shopAliases(), n={};
    for(var k in al) if(al.hasOwnProperty(k)) n[k]=al[k];
    pairs.forEach(function(p){
      p.from.forEach(function(f){ var fk=shopStrict(f); if(fk) n[fk]=p.to; });
      /* the kept name itself is never turned into anything else */
      var tk=shopStrict(p.to); if(tk&&n[tk]&&n[tk]!==p.to) delete n[tk];
    });
    /* an older alias pointing at a spelling that has just gone follows it */
    for(var k2 in n) if(n.hasOwnProperty(k2)&&map.hasOwnProperty(n[k2])) n[k2]=map[n[k2]];
    setPref('shopAlias',n);
  }
  TXV++; prep(); render(true); toast(msg);
  bg('renameShops',{pairs:sent},null,function(){ touched.forEach(function(x){ x.t.shop=x.was; }); TXV++; });
  return true;
}
/* ================================================================ boot */
watchSheets();
loadPriv();
loadUI();
goTabFromUrl();
clearBadge();
load();
</script>
