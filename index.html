/* ---- what arrives on the other side of a transfer -----------------------
   Between two currencies the bank's figure is the truth, not the rate in
   Setup, so it can be typed in. Left empty, the Setup rate is used - and
   rounded to what the receiving currency has, so a coin keeps its places. */
function xferCurs(s){ return {from:currencyOf(s.account)||'UAH', to:s.toAccount?(currencyOf(s.toAccount)||'UAH'):''}; }
function estToAmt(s){
  var c=xferCurs(s), amt=amtOf(s.amount,decOf(c.from));
  if(!c.to) return 0;
  if(c.to===c.from) return amt;
  var v=amt*rateOf(c.from)/(rateOf(c.to)||1), p=Math.pow(10,decOf(c.to));
  return Math.round(v*p)/p;
}
function toAmtField(s){
  var c=xferCurs(s);
  if(!c.to||c.to===c.from) return '';
  return '<div class="fieldlabel">Received <span class="opt">'+esc(c.to)+'</span></div>'+
    '<input class="tinput" id="f_toamt" inputmode="decimal" autocomplete="off" placeholder="'+esc(numStr(estToAmt(s)))+'"'+
    ' value="'+esc(s.toAmount||'')+'" oninput="toAmtTyped(this.value)">'+
    '<p class="tiny" style="margin:6px 4px 0">What the bank says arrived. Leave it empty to use the rate in Setup.</p>';
}
function toAmtTyped(v){ var s=S.sheet; if(!s) return; s.toAmount=v; s.toAmtTouched=true; }
/* ---- amount first ----------------------------------------------------
   The amount is the one thing you always know. Type it, and what you have
   written down with a number like it before is offered back - category,
   shop and account - one tap each. Nothing is saved until you press Add. */
var TXV=0, GIX=null, GIXV=-1;
function guessOn(){ return true; }
function guessIndex(){
  if(GIX&&GIXV===TXV) return GIX;
  var ix={e:{},i:{}}, today=parseD(D.today);
  (D.tx||[]).forEach(function(t){
    if(t.pending||!t.date||!t.account) return;
    if(isXfer(t)||isCorr(t)||isReceipt(t)||isLine(t)) return;
    if(t.k==='i'?(!t.source||isXferSrc(t.source)):!t.sub) return;
    var age=daysBetween(today,parseD(t.date));
    if(isNaN(age)||age>400) return;
    if(age<0) age=0;
    var key=t.k==='e'?(t.sub+'|'+(t.shop||'')+'|'+t.account):(t.source+'|'+t.account);
    var g=ix[t.k][key];
    if(!g) g=ix[t.k][key]={k:t.k,sub:t.sub||'',main:t.main||'',shop:t.shop||'',source:t.source||'',account:t.account,hits:[]};
    /* recent records count for more: a price from last year has moved on */
    g.hits.push([Math.abs(Number(t.amount)||0),Math.exp(-age/90)]);
  });
  GIX=ix; GIXV=TXV;
  return ix;
}
function guessesFor(kind,amt){
  if(!(amt>0)||!D) return [];
  var ix=guessIndex()[kind]||{}, out=[];
  Object.keys(ix).forEach(function(key){
    var g=ix[key], sc=0;
    /* an account or a category that has since gone is no guess at all */
    if(!(D.accMap&&D.accMap[g.account])) return;
    if(g.k==='e'&&!(D.subMap&&D.subMap[g.sub])) return;
    for(var i=0;i<g.hits.length;i++){
      var a=g.hits[i][0], d=Math.abs(a-amt), rel=d/Math.max(amt,a,1e-9);
      var c=d<1e-6?1:(rel<=0.03?0.8:(rel<=0.12?0.35:(rel<=0.3?0.08:0)));
      sc+=c*g.hits[i][1];
    }
    if(sc>=0.1) out.push({g:g,s:sc});

/* ── the shops you actually use ─────────────────────────────────────────
   Five names cover almost every expense, and typing one on a phone is the
   slowest part of adding a record. A transfer writes the destination account
   into the Shop cell, so those are left out - otherwise account names would
   push the real shops off the list. */
function recentShops(n){
  var list=(D.tx||[]).filter(function(t){
    /* keyed on the subcategory, not on isXfer: a transfer to an account that
       has since been renamed would still leave its old name sitting here */
    return t.k==='e'&&t.shop&&String(t.shop).trim()&&!isXferSub(t.sub)&&!isCorrName(t.sub);
  }).slice().sort(function(a,b){
    if(a.date!==b.date) return a.date<b.date?1:-1;
    return (Number(b.sort)||0)-(Number(a.sort)||0);
  });
  var seen={}, out=[];
  for(var i=0;i<list.length&&out.length<(n||5);i++){
    shopParts(list[i].shop).forEach(function(v){
      var key=v.toLowerCase();
      if(seen[key]||out.length>=(n||5)) return;
      seen[key]=1; out.push(v);
    });
  }
  return out;
}
/* ------------------------------------------------ shop name matching */
/* Two spellings mean the same shop when they survive the same reduction.
   Three levels, loosest last: strict folds case, punctuation, apostrophes,
   emoji and Cyrillic; loose also folds the y/i pair that Ukrainian and
   Russian spellings disagree about; skel drops the vowels, so Мак and Mc
   still meet. Everything the box suggests is measured on these. */
var SHOP_TR_ = {
  'а':'a','б':'b','в':'v','г':'h','ґ':'g','д':'d','е':'e','є':'ye','ж':'zh',
  'з':'z','и':'y','і':'i','ї':'yi','й':'y','к':'k','л':'l','м':'m','н':'n',
  'о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'kh','ц':'ts',
  'ч':'ch','ш':'sh','щ':'shch','ь':'','ю':'yu','я':'ya','ы':'y','э':'e',
  'ё':'e','ъ':''
};
/* \p{L} is the honest way to say "a letter in any script"; the fallback is
   for any engine old enough to reject it, so a bad regex cannot take the
   whole app down on someone's phone. */
var SHOP_JUNK_ = (function(){
  try { return new RegExp('[^\\p{L}\\p{N}]+', 'gu'); }
  catch (e) { return /[^0-9a-z\u0400-\u04ff]+/g; }
})();
function shopStrict(s){
  var t = String(s == null ? '' : s).toLowerCase()
    .replace(/[\u2019\u2018\u02bc\u00b4`']/g, '')
    .replace(SHOP_JUNK_, '');
  var out = '', i, c;
  for (i = 0; i < t.length; i++) {
    c = t.charAt(i);
    out += SHOP_TR_.hasOwnProperty(c) ? SHOP_TR_[c] : c;
  }
  return out;
}
function shopLoose(s){
  return shopStrict(s).replace(/y/g, 'i').replace(/w/g, 'v').replace(/(.)\1+/g, '$1');
}
function shopSkel(s){ return shopLoose(s).replace(/[aeiou]/g, ''); }
function shopLev(a, b){
  var m = a.length, n = b.length, prev = [], cur = [], i, j;
  for (j = 0; j <= n; j++) prev[j] = j;
  for (i = 1; i <= m; i++) {
    cur[0] = i;
    for (j = 1; j <= n; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1,
        prev[j - 1] + (a.charAt(i - 1) === b.charAt(j - 1) ? 0 : 1));
    }
    prev = cur.slice();
  }
  return prev[n];
}
/* every shop ever typed, most used first, rebuilt only when the ledger
   itself changed - this runs on every keystroke */
var SHOP_IX_ = null, SHOP_IX_N_ = -1;
function shopIndex(){
  var tx = D.tx || [];
  if (SHOP_IX_ && SHOP_IX_N_ === tx.length) return SHOP_IX_;
  var c = {};
  tx.forEach(function(t){
    if (t.k !== 'e' || !t.shop || isXferSub(t.sub) || isCorrName(t.sub)) return;
    shopParts(t.shop).forEach(function(v){ c[v] = (c[v] || 0) + 1; });
  });
  SHOP_IX_ = Object.keys(c).map(function(n){
    return { n: n, c: c[n], L: shopLoose(n), K: shopSkel(n) };
  }).sort(function(a, b){ return b.c - a.c; });
  SHOP_IX_N_ = tx.length;
  return SHOP_IX_;
}
function shopMatches(qs, n){
  var L = shopLoose(qs), K = shopSkel(qs);
  if (!L) return [];
  var t0 = [], t1 = [], t2 = [], t3 = [];
  shopIndex().forEach(function(x){
    if (x.L.indexOf(L) === 0) t0.push(x.n);
    else if (x.L.indexOf(L) > 0) t1.push(x.n);
    else if (K && x.K.indexOf(K) === 0) t2.push(x.n);
    else if (K.length >= 3 && shopLev(K, x.K.slice(0, K.length)) <= 1) t3.push(x.n);
  });
  /* the loose tiers are noisy - 'аптек' reaches as far as Patreon - so they
     only get to speak when the tight ones found nothing at all */
  var out = t0.concat(t1);
  if (!out.length) out = t2.concat(t3);
  return out.slice(0, n || 6);
}
function shopChipsInner(cur){
  /* with several shops, the one being typed is the part after the last
     semicolon, and the ones before it are not offered again */
  var parts = String(cur || '').split(';'), typed = parts.pop().trim();
  var before = parts.map(function(x){ return shopStrict(x); });
  /* nothing typed yet: the five you used last. Typing turns the same row
     into search results over every shop in the ledger. */
  var list = (typed ? shopMatches(typed, 10) : recentShops(10)).filter(function(x){
    return before.indexOf(shopStrict(x)) < 0;
  }).slice(0, typed ? 6 : 5);
  if (!list.length) return '';
  var c = shopStrict(typed);
  return list.map(function(x){
    return '<button class="shopchip' + (c && shopStrict(x) === c ? ' on' : '') +
      '" data-shop="' + esc(x) + '" onclick="pickShop(' + q(x) + ')">' + esc(x) + '</button>';
  }).join('');
}
function shopChips(cur){
  /* the row is always in the document so typing can refill it in place;
     it hides itself when empty rather than leaving a gap under the field */
  var inner = shopChipsInner(cur);
  return '<div class="shopchips" id="shopchips"' + (inner ? '' : ' style="display:none"') +
    '>' + inner + '</div>';
}
/* Tapping a chip is a choice, so it clears autoShop the way typing does -
   a subcategory's default shop must never overwrite it afterwards. Tapping
   the chip that is already on clears the field, so it is undoable. */
function pickShop(v){
  var s=S.sheet; if(!s) return;
  /* it takes the place of the shop being typed - the one after the last
     semicolon - and the shops before it stay */
  var parts=String(s.shop||'').split(';'), last=parts.pop();
  var keep=parts.map(function(x){ return x.trim(); }).filter(Boolean);
  var same=shopStrict(last)!==''&&shopStrict(last)===shopStrict(v);
  s.shop=shopJoin(same?keep:keep.concat([v])); s.autoShop='';
  var el=document.getElementById('f_shop'); if(el) el.value=s.shop;
  markShopChips();
  applyShopRule();
}
function markShopChips(){
  var box = document.getElementById('shopchips'); if (!box) return;
  var inner = shopChipsInner((S.sheet && S.sheet.shop) || '');
  box.innerHTML = inner;
  box.style.display = inner ? '' : 'none';
}
function shopTyped(v){
  var s=S.sheet; if(!s) return;
  s.shop=v; s.autoShop='';
  markShopChips();
  applyShopRule();
}

/* ══════ the amount field is a calculator ══════════════════════════════
   100+100 in the amount is 200. Written out as a parser rather than handed
   to eval: eval on a field somebody types into is a door that should not
   exist, and this way a half finished sum just reads as not-a-number
   instead of throwing. Handles + - * / and brackets, with the usual
   precedence. */
function calcEval(src,dec){
  var s=String(src==null?'':src)
    .replace(/[\u00d7xX]/g,'*').replace(/[\u00f7:]/g,'/')
    .replace(/\u2212/g,'-').replace(/,/g,'.').replace(/\s+/g,'');
  if(!s) return null;
  if(/[^0-9.+\-*/()]/.test(s)) return NaN;
  var i=0;
  function at(){ return s.charAt(i); }
  function number(){
    var st=i;
    while(i<s.length&&/[0-9.]/.test(s.charAt(i))) i++;
    if(i===st) return NaN;
    var txt=s.slice(st,i);
    if(txt.split('.').length>2) return NaN;
    var v=parseFloat(txt);
    return isNaN(v)?NaN:v;
  }
  function factor(){
    if(at()==='-'){ i++; var n=factor(); return isNaN(n)?NaN:-n; }
    if(at()==='+'){ i++; return factor(); }
    if(at()==='('){
      i++; var v=expr();
      if(at()!==')') return NaN;
      i++; return v;
    }
    return number();
  }
  function term(){
    var v=factor();
    while(at()==='*'||at()==='/'){
      var op=s.charAt(i++), r=factor();
      if(isNaN(v)||isNaN(r)) return NaN;
      if(op==='/'&&r===0) return NaN;
      v=op==='*'?v*r:v/r;
    }
    return v;
  }
  function expr(){
    var v=term();
    while(at()==='+'||at()==='-'){
      var op=s.charAt(i++), r=term();
      if(isNaN(v)||isNaN(r)) return NaN;
      v=op==='+'?v+r:v-r;
    }
    return v;
  }
  var out=expr();
  if(i<s.length) return NaN;
  if(isNaN(out)||!isFinite(out)) return NaN;
  var p=Math.pow(10,(dec===undefined?2:dec));
  return Math.round(out*p)/p;
}
/* a plain number is not a sum; anything with an operator or a bracket is */
function isSum(a){
  /* a leading minus is a sign, not a sum, but a bracket is arithmetic from
     the very first key - otherwise a half typed sum reads as a bare 0 */
  var s=String(a==null?'':a);
  return /[+*/()\u00d7\u00f7]/.test(s)||/[-\u2212]/.test(s.slice(1));
}
/* what every caller that used to write parseFloat(s.amount) asks for now */
/* How many places this currency actually has. A hryvnia has two; a coin
   whose single unit is worth thousands of hryvnia needs far more, or you
   could not write down what you spent at all. */
function decOf(cur){
  cur=String(cur||'UAH').toUpperCase();
  if(/^(BTC|ETH|SOL|LTC|BCH|XMR|TON|DOT|AVAX|XRP)$/.test(cur)) return 8;
  return (rateOf(cur)>=1000)?8:2;
}
function decOfAcc(acc){ return decOf(currencyOf(acc)); }
/* a small number must never reach the screen as 4.8e-5 */
function numStr(n){
  n=Number(n)||0;
  if(n&&Math.abs(n)<1e-4) return n.toFixed(8).replace(/0+$/,'').replace(/\.$/,'');
  return String(n);
}
function amtOf(a,dec){
  /* an amount is a size, never a direction: the kind of record decides the
     sign, so a sum that lands below zero is taken at its magnitude */
  var v=isSum(a)?calcValue(a,dec):parseFloat(String(a==null?'':a).replace(/\u2212/g,'-').replace(',','.'));
  return (v===null||isNaN(v))?0:Math.abs(v);
}
/* The pad drives whichever amount is on screen. It is handed its target
   rather than reaching for one, so a window left open over the sheet can
   never catch keystrokes meant for the sheet behind it. */
function closeAll(a){
  /* what the hand opened and did not close, the pad closes for it, so a sum
     still reads as a number while the brackets are half typed */
  a=String(a==null?'':a);
  var n=(a.match(/\(/g)||[]).length-(a.match(/\)/g)||[]).length;
  while(n-->0) a=a+')';
  return a;
}
function calcValue(a,dec){ return calcEval(closeAll(a),dec); }
function pressInto(o,k,after,dec){
  dec=(dec===undefined)?2:dec;
  if(!o) return;
  var a=o.amount||'';
  /* the digit rules - one dot, two decimals, no leading zero - belong to the
     number being typed right now, not to the whole expression */
  var tail=a.split(/[+\-*/()\u00d7\u00f7\u2212]/).pop();
  var last=a.charAt(a.length-1);
  var opens=(a.match(/\(/g)||[]).length, closes=(a.match(/\)/g)||[]).length;
  /* a bracket or a digit straight after a finished value is the multiplication
     sign the hand left out, so the pad writes it in instead of nonsense */
  var value=/[0-9.)]/.test(last);
  if(k==='\u232B') a=a.slice(0,-1);
  else if(k==='='){
    a=closeAll(a);
    if(!isSum(a)) return;
    var val=calcEval(a,dec);
    if(val===null||isNaN(val)){ toast('That sum is not finished'); return; }
    a=String(Math.abs(val));
  }
  else if(k==='.'){
    if(last===')') a=a+'\u00d70.';
    else if(tail.indexOf('.')<0) a=a+(tail?'':'0')+'.';
  }
  else if(/[+\u2212\u00d7\u00f7]/.test(k)){
    /* an amount is a size, so it starts with a number; inside a bracket a
       minus may open a term, and it must never swallow the bracket */
    if(!a) return;
    if(last==='('){ if(k!=='\u2212') return; }
    else if(/[+\u2212\u00d7\u00f7]/.test(last)) a=a.slice(0,-1);
    a=a+k;
  }
  else if(k==='('){ a=a+(value?'\u00d7(':'('); }
  else if(k===')'){
    /* nothing is open, or the bracket holds nothing yet */
    if(opens<=closes||!value) return;
    a=a+k;
  }
  else{
    if(last===')') a=a+'\u00d7';
    else if(tail.indexOf('.')>-1&&tail.split('.')[1].length>=dec) return;
    a=(a==='0'?k:a+k);
  }
  if(a.length>32) return;
  o.amount=a;
  if(after) after();
}
/* the four columns of keys, wired to whatever handler is passed in */
function padKeys(fn){
  return '<div class="keys calc">'+
    ['(',')','\u232B','\u00f7',
     '7','8','9','\u00d7',
     '4','5','6','\u2212',
     '1','2','3','+',
     '0','.','='].map(function(k){
      var op=/[(+)\u2212\u00d7\u00f7=]/.test(k);
      var cls='key'+(op?' opkey':'')+(k==='0'?' wide':'')+(k==='='?' eqkey':'');
      return '<button class="'+cls+'" style="'+(k==='\u232B'?'font-size:19px;font-weight:400':'')+'" onclick="'+fn+'('+q(k)+')">'+k+'</button>';
    }).join('')+'</div>';
}
/* the big number, wherever it is shown: the sum itself on top, its running
   total underneath, so what will be saved is never a guess */
function amtHtml(raw,sign,cur){
  var sum=isSum(raw), val=sum?calcValue(raw,decOf(cur)):null;
  return sign+(sum?esc(raw):formatTyped(raw))+
    ' <span style="font-size:26px;letter-spacing:-1px;opacity:.55">'+esc(cur==='UAH'?'\u20B4':cur)+'</span>'+
    (sum?'<span class="amtsum">'+(val===null||isNaN(val)?'\u2026':'= '+formatTyped(String(Math.abs(val))))+'</span>':'');
}
function press(k){ pressInto(S.sheet,k,updateAmt,S.sheet?decOfAcc(S.sheet.account):2); }
/* the = key settles the sum in place, so the total can be checked before saving */
function saveSheet(){
  var s=S.sheet; if(!s) return;
  /* the amount may be a sum - 100+100 is 200 */
  var sdec=decOfAcc(s.account);
  if(isSum(s.amount)&&isNaN(calcValue(s.amount,sdec))){ toast('That sum is not finished'); return; }
  var amt=amtOf(s.amount,sdec);
  /* a receipt may be entered as its parts alone - then the parts are the
     total, and the big number is simply their sum */
  if(!amt&&s.receipt&&!s.edit) amt=splitSum(s);
  if(!amt){ toast('Enter an amount first'); return; }
  if(s.kind==='e'&&!s.sub&&!s.receipt){ toast('Pick a subcategory'); return; }
  if(s.kind==='i'&&!s.source){ toast('Pick a source'); return; }
  if(!s.account){ toast('Pick an account'); return; }
  /* money moving to one of your accounts - a transfer, or cash taken out.
     One written before the two were paired may be saved as it was, with
     nowhere to go; everything else says where it goes. */
  var xfer=xferForm(s)&&!(s.edit&&s.loose&&!s.toAccount);
  var toCur='', toAmt=0;
  if(xfer){
    if(!s.toAccount){ toast('Choose where it goes'); return; }
    if(s.toAccount===s.account){ toast('Pick a different account'); return; }
    toCur=currencyOf(s.toAccount)||'UAH';
    toAmt=sheetToAmt(s);
    if(!toAmt){ toast('Enter what arrived in '+toCur); return; }
  }
  var dEl=document.getElementById('f_date'); if(dEl&&dEl.value) s.date=dEl.value;
  var cur=currencyOf(s.account);
  /* an ATM's or a transfer's fee, typed in with it - or, on a saved one,
     changed or cleared (sent only when it changed; 0 takes it away) */
  var fee=0, feeSend=false, fraw=String(s.fee||'').trim();
  if(feeShown(s)&&(xfer||s.edit)){
    if(!s.edit) feeSend=!!fraw;
    else feeSend=fraw!==String(s.feeWas||'').trim();
    if(feeSend&&fraw){
      fee=amtOf(fraw,sdec);
      if(!(fee>0)){ toast('That fee does not look like an amount'); return; }
    }
  }
  /* into your cash it is written as a withdrawal, anywhere else as a
     transfer - whichever of the two the sheet has */
  var words=xfer?xferWords(s.account,s.toAccount):null;
  if(words&&words.sub){ s.sub=words.sub; var wsm=D.subMap[words.sub]; if(wsm&&wsm.main) s.main=wsm.main; }
  var feeNote=(words?words.atm:isAtmName(s.sub))?'ATM fee':'Transfer fee';
  /* a spelling merged away before is saved under the name you kept */
  if(s.kind==='e'&&!xfer) s.shop=shopNorm(s.shop);
  var payload={
    kind:s.kind, id:s.id||'', row:s.row||0, was:s.was||{date:'',amount:0,account:''},
    date:s.date, amount:amt, currency:cur,
    account:s.account, main:s.main, sub:s.sub, source:s.source,
    shop:s.shop, note:s.note, flags:s.flags||[],
    /* every mark is in the list - projects, owed - so the sheet can take it whole */
    allFlags:true
  };
  if(feeSend){ payload.fee=fee; payload.feeSub=feeSubName(); payload.feeNote=feeNote; }
  /* a saved one's fee keeps its word in step with where the money goes */
  else if(s.edit&&xferForm(s)) payload.feeNote=feeNote;
  /* the ATM's fee is spending, so a trip that is on has it, even though
     the cash itself is not trip spending until it is spent */
  if(feeSend&&!s.edit) payload.feeTrip=s.trip||tripName()||'';
  /* which Calendar payment this settles, if any - '' unlinks it */
  if(s.kind==='e') payload.sched=s.sched||'';
  payload.trip=s.trip||'';
  if(xfer){
    payload.shop=s.toAccount; payload.to=s.toAccount; payload.toCurrency=toCur; payload.toAmount=toAmt;
    payload.inSource=words.src;
    /* an expense becoming a transfer now: the money arrives on the other side */
    if(s.edit&&!s.wasPair) payload.makePair=true;
  }
  /* a scheduled payment keeps the category you gave it, so next month it
     is already filled in */
  if(s.calSvc&&s.sub){
    var seen=pref('calCat',{})||{};
    if(seen[s.calSvc]!==s.sub){ seen[s.calSvc]=s.sub; setPref('calCat',seen); }
  }

  if(s.edit){
    var t=findTx(s.kind,s.row);
    if(t){ if(t.id) payload.id=t.id; if(t.srow) payload.row=t.srow; }
    var wasReceipt=isReceipt(t);
    /* the shape changed, which is a different write: the two receipt columns
       move, not just the fields. Do that first and on its own, so a half
       converted row is never left behind. */
    if(t&&s.kind==='e'&&wasReceipt!==!!s.receipt){
      var to=s.receipt?'receipt':'expense';
      closeSheet(); S.sel=null; S.selDel=0; prep(); render(true);
      toast(s.receipt?'Making it a receipt…':'Making it an expense…');
      bg('convertTx',{id:payload.id, row:payload.row, was:s.was||{date:'',amount:0,account:''},
                      to:to, sub:s.receipt?'':s.sub, receipt:s.receipt?newReceiptId():''});
      return;
    }
    var backup=t?JSON.parse(JSON.stringify(t)):null;
    /* the other half of a transfer moves with it, on screen as in the sheet */
    var mate=(t&&isXfer(t))?xferMate(t):null;
    var mateBackup=mate?JSON.parse(JSON.stringify(mate)):null;
    if(t){
      var patch=localTx(s,cur,null);
      patch.row=s.row; patch.pending=true; delete patch.cid;
      if(t.srow) patch.srow=t.srow;
      for(var k in patch) if(patch.hasOwnProperty(k)) t[k]=patch[k];
      if(xfer) t.shop=s.toAccount;
      if(wasReceipt){
        /* what was typed is the new total; the row itself goes on holding
           whatever is left of it, exactly as the sheet will recompute */
        t.rtotal=amt;
        var spent=0;
        linesOf(t.receipt).forEach(function(x){ spent+=Math.abs(Number(x.amount)||0); });
        t.amount=Math.round((amt-spent)*1e8)/1e8;
        t.uah=t.amount*rateOf(cur);
      }
    }
    if(mate&&xfer){
      mate.date=s.date; mate.amount=toAmt; mate.currency=toCur; mate.account=s.toAccount;
      mate.note=s.note; mate.uah=toAmt*rateOf(toCur);
      if(words.src) mate.source=words.src;
    }
    /* the fee: changed where it is, added under it, or hidden until the
       sheet has taken it away - and its word follows where the money went */
    var feeRow=(t&&s.kind==='e')?feeOf(t):null, feeBackup=feeRow?JSON.parse(JSON.stringify(feeRow)):null;
    var fcid2='', feeHid='';
    if(feeRow&&payload.feeNote&&/^(ATM|Transfer) fee$/.test(feeRow.note||'')) feeRow.note=payload.feeNote;
    if(feeSend){
      if(fee>0&&feeRow){ feeRow.amount=fee; feeRow.uah=fee*rateOf(feeRow.currency||cur); feeRow.pending=true; }
      else if(fee>0){
        fcid2='p'+(++S.cid);
        var nf=feeLocal(s,fee,cur,payload.id,fcid2,feeNote);
        S.pending[fcid2]=nf; D.tx.push(nf);
      }
      else if(feeRow){ feeHid=delKey(feeRow); S.pendingDel[feeHid]=1; rebuildTx(); }
    }
    closeSheet(); prep(); render(true); toast('Saved');
    bg('updateTx',payload,function(){
      if(fcid2) delete S.pending[fcid2];
      if(feeHid) delete S.pendingDel[feeHid];
    },function(){
      if(t&&backup) for(var k2 in backup) if(backup.hasOwnProperty(k2)) t[k2]=backup[k2];
      if(mate&&mateBackup) for(var k3 in mateBackup) if(mateBackup.hasOwnProperty(k3)) mate[k3]=mateBackup[k3];
      if(feeRow&&feeBackup) for(var k4 in feeBackup) if(feeBackup.hasOwnProperty(k4)) feeRow[k4]=feeBackup[k4];
      if(fcid2) D.tx=D.tx.filter(function(x){ return x.cid!==fcid2; });
      if(feeHid) rebuildTx();
    });
    /* a payment from the Calendar whose amount was just changed */
    if(s.kind==='e'&&!xfer&&!wasReceipt&&s.sched&&backup&&Math.abs(Math.abs(Number(backup.amount)||0)-amt)>1e-9)
      priceCheck(schedSvc(s.sched),amt,cur);
    return;
  }

  var cid='p'+(++S.cid);
  /* the record's id is made here, so a retry can never write it twice */
  payload.id=newId(); s.id=payload.id;
  var fcid=fee>0?'p'+(++S.cid):'';
  if(fcid){ var frow=feeLocal(s,fee,cur,payload.id,fcid,feeNote,payload.feeTrip); S.pending[fcid]=frow; D.tx.push(frow); }
  /* an old sheet script does not know fees: the fee goes up as an ordinary
     expense of its own, once the payment itself is in */
  var feeLater=null;
  if(fee>0&&apiV()<3){
    var fsm=D.subMap[feeSubName()]||{};
    feeLater={kind:'e',id:payload.id+'-f',row:0,was:{date:'',amount:0,account:''},date:s.date,amount:fee,currency:cur,
              account:s.account,main:fsm.main||'',sub:feeSubName(),source:'',shop:'',note:payload.feeNote,flags:[],
              trip:payload.feeTrip||''};
    delete payload.fee;
  }
  function dropFee(){ if(fcid){ delete S.pending[fcid]; D.tx=D.tx.filter(function(x){ return x.cid!==fcid; }); } }
  /* the answer to the payment: with a new script it carries the fee too */
  function cleanMain(){ delete S.pending[cid]; if(fcid&&!feeLater) delete S.pending[fcid]; }
  function sendFee(){
    if(feeLater) bg('addTx',feeLater,function(){ delete S.pending[fcid]; },function(){ dropFee(); });
  }
  if(xfer){
    s.shop=s.toAccount;
    var xrow=localTx(s,cur,cid);
    S.pending[cid]=xrow;
    D.tx.push(xrow);
    closeSheet(); prep(); render(false);
    toast('Transferred'+(words.atm?' to cash':'')+(fee>0?', fee added':''));
    bgThen('addTransfer',payload,sendFee,function(){
      D.tx=D.tx.filter(function(x){ return x.cid!==cid; }); dropFee();
    },cleanMain);
    return;
  }
  if(s.receipt){
    /* whatever was written into the split goes with it; a line that is only
       half filled in is a mistake worth stopping for, an empty one is not */
    var drafts=[], bad='';
    (s.lines||[]).forEach(function(l){
      var fl=l.flags||[], la=amtOf(l.amount,sdec);
      var what=l.sub||fl.some(function(k){ return String(k).slice(0,2)!=='g:'; });
      if(!la&&!what) return;
      if(!la) bad=bad||'One split line has no amount';
      else if(!what) bad=bad||'One split line has no category';
      else drafts.push({id:newId(), amount:la, sub:l.sub||'', flags:fl.slice(), note:String(l.note||'').trim()});
    });
    if(bad){ toast(bad); return; }
    payload.lines=drafts;
    payload.receipt=newReceiptId();
    /* The parent row carries whatever the lines have not taken, so today's
       spending is right the moment you enter it - parent + lines never stops
       being the amount you actually paid. */
    var used=0; drafts.forEach(function(l){ used+=l.amount; });
    var rrow=localTx(s,cur,cid);
    rrow.receipt=payload.receipt; rrow.rtotal=amt;
    rrow.amount=Math.round((amt-used)*1e8)/1e8;
    rrow.uah=rrow.amount*rateOf(cur);
    S.pending[cid]=rrow;
    D.tx.push(rrow);
    var kids=[cid];
    drafts.forEach(function(l){
      var lcid='p'+(++S.cid), sub=D.subMap[l.sub];
      var row={k:'e',row:0,id:l.id,cid:lcid,pending:true,date:s.date,amount:l.amount,
        currency:cur,account:s.account,main:sub?sub.main:'',sub:l.sub,
        shop:s.shop,note:l.note||'',uah:l.amount*rateOf(cur),
        real:sub?sub.real:true,receipt:payload.receipt,rtotal:null,trip:s.trip||'',
        flags:(l.flags||[]).join(',')};

    toast(drafts.length?('Receipt added with '+drafts.length+' line'+(drafts.length===1?'':'s')):'Receipt added');
    bg('addReceipt',payload,function(){ kids.forEach(function(k){ delete S.pending[k]; }); },function(){
      D.tx=D.tx.filter(function(x){ return kids.indexOf(x.cid)<0; });
    });

  }
  var row=localTx(s,cur,cid);
  S.pending[cid]=row;
  D.tx.push(row);
  if(s.sched) S.justPaid={key:s.sched,t:Date.now()};
  closeSheet(); prep(); render(false); toast(s.sched?'Paid':(fee>0?'Added, fee too':'Added'));
  bgThen('addTx',payload,sendFee,function(){
    D.tx=D.tx.filter(function(x){ return x.cid!==cid; }); dropFee();
  },cleanMain);

}
/* ---- a subscription that changed its price ------------------------------
   A Calendar payment written down for a different amount than the Calendar
   says: the app offers to take the new price, so next month's tick is right.
   In the payment's own currency that is the new price, exactly. Paid in
   another currency, exchange rates and bank fees move the amount a little
   every month, so only a clear jump is mentioned - and the Calendar entry
   opens for the real new price to be typed in. */
function calBySvc(svc){
  var list=(D.calendar&&D.calendar.items)||[];
  for(var i=0;i<list.length;i++) if(list[i].service===svc) return list[i];
  return null;
}
function priceCheck(svc,amt,cur){
  var it=svc&&calBySvc(svc); if(!it) return;
  var own=String(it.currency||'UAH').toUpperCase(), cost=Math.abs(Number(it.cost)||0);
  cur=String(cur||'UAH').toUpperCase(); amt=Math.abs(Number(amt)||0);
  if(!cost||!amt) return;
  var name=strip(it.service);
  if(own===cur){
    var p=Math.pow(10,decOf(own)), paid=Math.round(amt*p)/p;
    if(Math.abs(paid-cost)<0.5/p) return;
    S.priceOffer={row:it.row,cost:paid};
    toastAction(PRIV.all?(name+' was paid at a new price'):(name+' now costs '+(own==='UAH'?money(paid,2):numStr(paid)+' '+own)),'Update Calendar','applyPrice()',8000);
  }else{
    var conv=amt*rateOf(cur)/(rateOf(own)||1);
    if(Math.abs(conv-cost)/cost<=0.06) return;
    S.priceOffer={row:it.row,cost:null};
    toastAction('Did '+name+' change its price?','Edit price','editPrice()',8000);
  }
}
function applyPrice(){
  var o=S.priceOffer; S.priceOffer=null; hideAction();
  var it=o&&calItem(o.row); if(!it||o.cost===null) return;
  var was={cost:it.cost,uah:it.uah};
  it.cost=o.cost; it.uah=o.cost*rateOf(it.currency||'UAH');
  render(true); toast('Calendar updated');
  bg('saveCalendar',{edits:[{row:it.row,cost:o.cost}]},null,function(){ it.cost=was.cost; it.uah=was.uah; });
}
function editPrice(){ var o=S.priceOffer; S.priceOffer=null; hideAction(); if(o) openCalEdit(o.row); }

var TRASH_ICON='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5h16M9.5 6.5V4.6h5V6.5M6.4 6.5l.9 13a1.6 1.6 0 0 0 1.6 1.5h6.2a1.6 1.6 0 0 0 1.6-1.5l.9-13"/><path d="M10.4 10.5v6.6M13.6 10.5v6.6"/></svg>';

/* ── swipe a row: left uncovers Delete, right adds the same again today ──
   The row keeps its place in the DOM: its children ride on a --sw offset
   while the panels wait just off either edge. Nothing is re-wrapped, so the
   handle and the row's own tap target work exactly as before. The gesture
   only claims the finger once it is clearly sideways, which keeps vertical
   scrolling and the handle's drag out of its way. Right is a quick flick -
   let go past the mark and it happens, with Undo - and only on rows that
   can be repeated (data-rep). */
var SW=null, SWOPEN=null, REP_AT=78;
function swPanel(row){
  var p=row.querySelector(".swdel");
  if(p) return p;
  p=document.createElement("span");
  p.className="swdel";
  p.innerHTML=TRASH_ICON;
  p.addEventListener("click",function(e){ e.stopPropagation(); e.preventDefault(); swipeDelete(p); });
  row.appendChild(p);
  return p;
}
function swRepPanel(row){
  var p=row.querySelector(".swrep");
  if(p) return p;
  p=document.createElement("span");
  p.className="swrep";
  p.innerHTML=svgIc('repeat',20,2)+'<span>Again today</span>';
  row.appendChild(p);
  return p;
}
function swClose(){
  var row=SWOPEN; if(!row) return;
  SWOPEN=null;
  row.classList.remove("swopen");
  row.style.removeProperty("--sw");
  /* let it slide shut, then put the row back to being an ordinary row */
  setTimeout(function(){
    if(row.classList.contains("swopen")||(SW&&SW.row===row)) return;
    row.classList.remove("swmoved");
    var p=row.querySelector(".swdel"); if(p) p.parentNode.removeChild(p);
    var r=row.querySelector(".swrep"); if(r) r.parentNode.removeChild(r);
  },300);
}
function swDown(e){
  if(DRAG||!e.target.closest) return;
  if(e.target.closest(".grip")||e.target.closest(".swdel")) return;
  var row=e.target.closest(".swipeable"); if(!row) return;
  SW={row:row,x:e.clientX,y:e.clientY,dx:0,axis:0,pid:e.pointerId,base:row===SWOPEN?-88:0,
      rep:row.getAttribute('data-rep')==='1',armed:false};
  document.addEventListener("pointermove",swMove,{passive:false});
  document.addEventListener("pointerup",swUp);
  document.addEventListener("pointercancel",swUp);

  var d=parseD(dstr), diff=daysBetween(parseD(D.today),d);
  return diff===0?'today':diff===1?'yesterday':(MONS[d.getMonth()]+' '+d.getDate());

/**
 * A drop onto another day: the record takes that date and lands where the
 * line showed. Whatever belongs to it goes along - a transfer's other half,
 * a receipt's lines, a fee paid with it - exactly as the sheet script moves
 * them, and its new place in the day travels in the same request.
 */
function dropOnDay(me,day,nb){
  if(!me||me.date===day){ render(true); return; }
  if(me.pending?!me.id:!me.row){ toast('Wait a moment — it is still saving'); render(true); return; }
  var refObj=txRef(me);                    /* where it is now, before the date moves */
  var fromDay=me.date, group=[me], mt=xferMate(me), fee=feeOf(me);
  if(mt) group.push(mt);
  if(isReceipt(me)) linesOf(me.receipt).forEach(function(x){ group.push(x); });
  if(fee&&fee.date===fromDay) group.push(fee); else fee=null;
  var back=group.map(function(x){ return {t:x,date:x.date,sort:x.sort}; });
  var seq=dayOrder(day), at=nb?seq.indexOf(nb):-1;
  /* dropped by a fee shown on its own: its place is its payment's */
  if(at<0&&nb&&feeParentId(nb)) at=seq.indexOf(txById('e',feeParentId(nb)));
  if(at<0) at=seq.length;
  seq.splice(at,0,me);
  if(fee) seq.splice(at+1,0,fee);
  group.forEach(function(x){ x.date=day; });
  var rn=renumberDay(seq);
  prep(); render(true);
  toast('Moved to '+dayWords(day));
  if(me.pending){
    /* still waiting in the outbox: it simply goes up with the new date */
    var qe=queuedAdd(me.id);
    if(qe){ qe.payload.date=day; qSave(); }
    placeLater(seq,day);
    return;
  }
  placeLater(seq,day);
  var p={items:[refObj],date:day};
  if(apiV()>=3) p.order=rn.touched.map(orderRef);
  bg('editMany',p,null,function(){ back.forEach(function(b){ b.t.date=b.date; b.t.sort=b.sort; }); });
}

function deleteSheet(){
  var s=S.sheet; if(!s) return;
  if(!S.confirmDel){
    S.confirmDel=true;
    var b=document.getElementById('delbtn');
    if(b){ b.textContent='Tap again to delete'; b.style.background='rgba(214,88,66,.20)'; }
    clearTimeout(S._delT); S._delT=setTimeout(function(){ S.confirmDel=false;
      var x=document.getElementById('delbtn'); if(x){ x.textContent='Delete this record'; x.style.background='rgba(214,88,66,.10)'; } },3500);
    return;
  }
  S.confirmDel=false;
  var gone=findTx(s.kind,s.row);
  closeSheet();
  if(!gone){ render(true); return; }
  if(gone.pending){ toast('Wait a moment \u2014 it is still saving'); return; }
  var ref=txRef(gone);

  if(s.was&&s.was.date) ref.was=s.was;
  holdDelete([gone],'deleteTx',ref,'Deleted');
}

/* ============================================================ BALANCE FIX */
/* Sometimes an expense was never written down and is too old to find. Rather
   than inventing a plausible-looking one, say what the balance really is and
   let the app record the difference under a Setup row flagged "No" - visible
   in Activity, invisible to Summary and Analytics. */
function openCorrect(name){
  var a=(D.accMap&&D.accMap[name])||(D.accounts||[]).filter(function(x){return x.name===name;})[0];
  if(!a){ toast("Account not found"); return; }
  var cur=a.currency||"UAH";
  var base=(cur!=="UAH"&&a.balance!=null)?Number(a.balance):Number(a.uah||0);
  if(!isFinite(base)) base=0;
  /* the phone number pad has no minus key, so the sign is a button and the
     field only ever holds digits - it starts on the sign the balance has */
  var cp=Math.pow(10,decOf(cur));
  S.corr={acc:a.name,cur:cur,from:Math.round(base*cp)/cp,to:"",neg:base<0,date:D.today};
  drawCorrect();
}
function corrNum(v){ return Number(String(v).replace(",",".").replace(/[^0-9.]/g,"")); }
function corrTo(){ var v=Math.abs(corrNum(S.corr.to)); return S.corr.neg?-v:v; }
function corrSign(){
  S.corr.neg=!S.corr.neg;
  var b=document.getElementById("corrsign");
  if(b){ b.textContent=S.corr.neg?"\u2212":"+"; b.className="signbtn"+(S.corr.neg?" on":""); }
  corrHint();
}
function drawCorrect(){
  var c=S.corr;
  /* the balance is the thing being edited, so it is shown in full even when
     the rest of the app is blurred */
  var now=(c.cur==="UAH")
    ?((c.from<0?"\u2212":"")+Math.abs(c.from).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})+" \u20b4")
    :(c.from+" "+c.cur);
  var h='<div class="scrim" onclick="closeModal()"></div><div class="sheet">'+
    '<div class="sheet-head"><button class="xbtn" onclick="closeModal()">\u2715</button>'+
    '<span class="sheet-title">Edit balance</span>'+
    '<button class="savebtn" style="background:linear-gradient(160deg,'+ok(.72,.13,255)+','+ok(.60,.15,255)+')" onclick="saveCorrect()">Save</button></div>'+
    '<div class="sheet-body" style="margin-top:14px">';
  h+='<div class="fieldlabel">'+esc(strip(c.acc))+'</div>';
  h+='<p class="tiny" style="margin:0 0 12px">Type what the bank actually shows. The difference is filed as a correction \u2014 it is never counted as spending or income.</p>';
  h+='<div class="glass" style="padding:2px 0">'+
     '<div class="corrfield"><span>Now</span><span style="flex:none;opacity:.55">'+esc(now)+'</span></div>'+
     '<div class="corrfield"><span>Should be</span>'+
       '<button id="corrsign" type="button" class="signbtn'+(c.neg?' on':'')+'" onclick="corrSign()">'+(c.neg?'\u2212':'+')+'</button>'+
              '<input id="f_corr" class="tinput" inputmode="decimal" style="width:120px;padding:9px 11px;text-align:right;font-size:14px" placeholder="'+esc(String(Math.abs(c.from)))+'" value="'+esc(String(c.to))+'" oninput="S.corr.to=this.value;corrHint()"></div>'+
     '<div class="corrfield"><span>Date</span>'+
       '<input class="tinput" type="date" style="width:154px;padding:9px 11px;font-size:14px" value="'+esc(c.date)+'" onchange="S.corr.date=this.value"></div>'+
     '</div>';
  h+='<div id="corrhint" class="tiny" style="margin-top:11px;min-height:16px"></div>';
  h+='<div style="height:20px"></div></div></div>';
  document.getElementById("modal").innerHTML=h;
  corrHint();
  setTimeout(function(){ var el=document.getElementById("f_corr"); if(el) el.focus(); },80);
}
function corrHint(){
  var el=document.getElementById("corrhint"); if(!el) return;
  var c=S.corr, to=corrTo(), p=Math.pow(10,decOf(c.cur));
  if(!String(c.to).length||isNaN(to)){ el.textContent=""; return; }
  var d=Math.round((to-c.from)*p)/p;
  el.textContent=Math.abs(d)<0.5/p
    ?"That is the balance already — nothing to correct."
    :((d>0?"Adds ":"Takes off ")+numStr(Math.abs(d))+" "+c.cur+".");
}
function saveCorrect(){
  var c=S.corr, to=corrTo(), p=Math.pow(10,decOf(c.cur));
  if(!String(c.to).length||isNaN(to)){ toast("Enter the new balance"); return; }
  if(Math.abs(to-c.from)<0.5/p){ closeModal(); toast("Nothing changed"); return; }
  closeModal();
  toast("Balance corrected");
  bg("addCorrection",{id:newId(),account:c.acc,currency:c.cur,from:c.from,to:to,date:c.date});
}

  (D.setup.subcategories||[]).forEach(function(x){ subs[x.name]=1; });
  (D.setup.mainCategories||[]).forEach(function(x){ mains[x]=1; });
  (D.setup.incomeSources||[]).forEach(function(x){ srcs[x.name]=1; });
  var n=0;
  (D.tx||[]).forEach(function(t){
    if(t.k==='e'){ if((t.sub&&!subs[t.sub])||(t.main&&!mains[t.main])) n++; }
    else if(t.source&&!srcs[t.source]) n++;

  return n;

    else if(kind==='s'){ if(t.k==='e'&&t.sub===name) n++; }
    else if(t.k==='i'&&t.source===name) n++;

  return n;

/* ---- holding a row: shared by these lists and the shops ---------------- */
var CLP=null;
function clpCancel(){ if(CLP){ clearTimeout(CLP.t); CLP=null; } }
function clpDown(e){
  if(!e.target.closest||CDRAG) return;
  /* a new press: whatever an earlier hold was waiting to swallow is over */
  S.holdKey=null;
  var row=e.target.closest('[data-hold]'); if(!row) return;
  if(e.target.closest('.grip')) return;
  clpCancel();
  CLP={x:e.clientX,y:e.clientY,pid:e.pointerId,row:row,t:setTimeout(function(){
    var r=CLP&&CLP.row; CLP=null;
    if(!r||!r.isConnected) return;
    var kind=r.getAttribute('data-hold');
    if(kind==='cat'){
      var ck=r.getAttribute('data-ck'), ci=Number(r.getAttribute('data-ci'));
      S.holdKey='cat:'+ck+':'+ci;
      catHold(ck,ci);
    }else if(kind==='shop'){
      var sn=r.getAttribute('data-sn');
      S.holdKey='shop:'+sn;
      shopHold(sn);
    }
  },460)};
  document.addEventListener('pointermove',clpMove,{passive:true});
  document.addEventListener('pointerup',clpUp);
  document.addEventListener('pointercancel',clpUp);
}
function clpMove(e){
  if(!CLP||e.pointerId!==CLP.pid) return;
  if(Math.abs(e.clientX-CLP.x)>9||Math.abs(e.clientY-CLP.y)>9) clpCancel();
}
function clpUp(e){
  if(CLP&&e&&e.pointerId!==undefined&&e.pointerId!==CLP.pid) return;
  clpCancel();
  document.removeEventListener('pointermove',clpMove);
  document.removeEventListener('pointerup',clpUp);
  document.removeEventListener('pointercancel',clpUp);
}
document.addEventListener('pointerdown',clpDown,true);

/* ---- dragging a row by its grip ------------------------------------------
   The row follows the finger and a line shows where it will land: between
   two rows, or at the end of a group - another category's group moves a
   subcategory into that category. Near the top or the bottom of the sheet
   the list scrolls by itself. */
var CDRAG=null;
function catGripDown(e){
  var row=e.target.closest&&e.target.closest('.crow'); if(!row) return;
  var body=row.closest('.sheet-body'); if(!body) return;
  var k=row.getAttribute('data-ck'), i=Number(row.getAttribute('data-ci'));
  if(catSelOn(k)) return;
  e.preventDefault(); e.stopPropagation();
  clpCancel();
  var L=catList(k), br=body.getBoundingClientRect(), st=body.scrollTop, slots=[];
  [].slice.call(body.querySelectorAll('.clist[data-cl="'+k+'"]')).forEach(function(l){
    var g=l.getAttribute('data-cg')||'';
    [].slice.call(l.querySelectorAll('.crow')).forEach(function(r){
      if(r===row) return;
      var b=r.getBoundingClientRect();
      slots.push({g:g,before:L[Number(r.getAttribute('data-ci'))],y:b.top-br.top+st});
    });
    var end=l.querySelector('.addln'), lb=l.getBoundingClientRect();
    slots.push({g:g,before:null,y:(end?end.getBoundingClientRect().top:lb.bottom-6)-br.top+st});
  });
  if(!slots.length) return;
  var rb=row.getBoundingClientRect();
  CDRAG={k:k,x:L[i],row:row,body:body,slots:slots,startY:e.clientY,y:e.clientY,st0:st,
         top0:rb.top-br.top+st,h:rb.height,pid:e.pointerId,slot:null,line:null,raf:0,scr:0};
  row.classList.add('cdrag');
  body.classList.add('cdragging');
  try{ if(navigator.vibrate) navigator.vibrate(8); }catch(err){}
  document.addEventListener('pointermove',catGripMove,{passive:false});
  document.addEventListener('touchmove',catDragTouch,{passive:false});
  document.addEventListener('pointerup',catGripUp);
  document.addEventListener('pointercancel',catGripUp);
  catDragFrame();
}
function catDragTouch(e){ if(CDRAG) e.preventDefault(); }
function catGripMove(e){
  var d=CDRAG; if(!d||e.pointerId!==d.pid) return;
  e.preventDefault();
  d.y=e.clientY;
  if(!d.raf) d.raf=requestAnimationFrame(function(){ d.raf=0; catDragFrame(); });
  if(!d.scr) catDragScroll();
}
function catDragScroll(){
  var d=CDRAG; if(!d) return;
  function step(){
    if(CDRAG!==d){ return; }
    var br=d.body.getBoundingClientRect(), v=0;
    if(d.y<br.top+56) v=-Math.min(14,Math.ceil((br.top+56-d.y)/4));
    else if(d.y>br.bottom-56) v=Math.min(14,Math.ceil((d.y-(br.bottom-56))/4));
    if(!v){ d.scr=0; return; }
    var before=d.body.scrollTop;
    d.body.scrollTop=before+v;
    if(d.body.scrollTop===before){ d.scr=0; return; }
    catDragFrame();
    d.scr=requestAnimationFrame(step);
  }
  d.scr=requestAnimationFrame(step);
}
function catDragFrame(){
  var d=CDRAG; if(!d) return;
  var dy=(d.y-d.startY)+(d.body.scrollTop-d.st0);
  d.row.style.transform='translateY('+dy+'px)';
  var mid=d.top0+dy+d.h/2, best=null, bd=Infinity;
  d.slots.forEach(function(s){ var dist=Math.abs(s.y-mid); if(dist<bd){ bd=dist; best=s; } });
  if(best&&best!==d.slot){
    d.slot=best;
    if(!d.line){ d.line=document.createElement('i'); d.line.className='cdropline'; d.body.appendChild(d.line); }
    d.line.style.top=Math.round(best.y-2)+'px';
  }
}
function catGripUp(e){
  var d=CDRAG; if(!d||(e&&e.pointerId!==undefined&&e.pointerId!==d.pid)) return;
  document.removeEventListener('pointermove',catGripMove);
  document.removeEventListener('touchmove',catDragTouch);
  document.removeEventListener('pointerup',catGripUp);
  document.removeEventListener('pointercancel',catGripUp);
  CDRAG=null;
  if(d.raf) cancelAnimationFrame(d.raf);
  if(d.scr) cancelAnimationFrame(d.scr);
  if(d.slot&&!(e&&e.type==='pointercancel')) catMove(d.k,d.x,d.slot.g,d.slot.before);
  else catRepaint(d.k);
}
/* where it lands: before another entry, or at the end of a group */
function catMove(k,x,g,before){
  var L=catList(k), i=L.indexOf(x);
  if(i<0||before===x){ catRepaint(k); return; }
  var wasMain=x.main;
  L.splice(i,1);
  if(k==='s'&&g) x.main=g;
  var at=before?L.indexOf(before):-1;
  if(at<0){
    at=L.length;
    if(k==='s'&&g){ for(var j=L.length-1;j>=0;j--) if(L[j].main===g){ at=j+1; break; } }
  }
  L.splice(at,0,x);
  catRepaint(k);
  if(k==='s'&&g&&g!==wasMain){ toast('Moved to '+strip(g)+' · Save to keep it'); olderSoon(); }
}

function saveCats(){
  /* the rows these lists came from move each time a list is written back,
     so one save waits for the last one, and lists made before the sheet
     was last read take its rows first */
  if(catBusyNow()){ toast('The last change is still saving. One moment.'); return; }
  if(!catRows()){
    /* made before the sheet last changed them: saving would undo that */
    toast('The categories changed on the sheet meanwhile. Here they are as they are now: make your change once more.',7000);
    var scr=document.getElementById('catscr'), sk=scr?scr.getAttribute('data-k'):'';
    S.csel=null; catInit();
    if(sk) drawCatScreen(sk); else drawSettings();
    return;
  }
  /* a main category that was renamed here has to be renamed inside the
     subcategories too, or they would point at a name that no longer exists */
  var ren={};
  (D.setup.mainRows||[]).forEach(function(row,i){
    var was=D.setup.mainCategories[i];
    var hit=S.catM.filter(function(x){ return x.row===row; })[0];
    if(hit&&hit.name&&was!==hit.name) ren[was]=hit.name;
  });
  /* the editor moves them at once; only one still naming a category that is
     no longer on the list follows here (renaming A to B and C to A must not
     send C's subcategories on to B) */
  var mnow={}; S.catM.forEach(function(x){ mnow[String(x.name).trim()]=1; });
  S.catS.forEach(function(x){ if(ren[x.main]&&!mnow[x.main]) x.main=ren[x.main]; });
  /* a subcategory now under another category: once the sheet knows, its
     records are moved across too, older years included */
  var moved=[];
  S.catS.forEach(function(x){
    if(!x.orig||!x.row) return;
    var was=null; (D.setup.subcategories||[]).forEach(function(y){ if(y.name===x.orig) was=y; });
    if(!was) return;
    var oldMain=ren[was.main]||was.main;
    if(x.main!==oldMain) moved.push({from:x.orig,to:String(x.name).trim(),main:x.main});
  });
  var keep=function(l){ return l.filter(function(x){ return String(x.name).trim(); }); };
  if(moved.length){
    /* its records are moved one by one, every year of them, so this needs
       the sheet now and the history older than the phone keeps */
    if(offline()){ toast('Moving a subcategory to another category needs a connection.',5000); return; }
    if(UNDO||Object.keys(S.pending||{}).length||qCount()){ toast('Something is still saving. Try again in a moment.'); return; }
    if(!S.older){
      S.catBusy=true;
      toast('Getting the older records first\u2026',9000);
      loadOlderThen(function(){
        S.catBusy=false;
        /* still on these lists: carry on; somewhere else now: leave it */
        if(document.getElementById('catscr')) saveCats(); else toast('Not saved: tap Save again.',5000);
      },function(){
        S.catBusy=false;
        toast('The older records did not load, so it is not saved yet. Try Save again in a moment.',6000);
      });
      return;
    }
  }
  saveIcons();
  closeModal();
  toast('Saving\u2026');
  S.catBusy=true;
  var pl=JSON.parse(JSON.stringify({mains:keep(S.catM),subs:keep(S.catS),sources:keep(S.catI)}));
  if(!moved.length){ bg('saveCategories',pl,catSaved); return; }
  /* under the new category on screen at once, and back if the sheet says no */
  var back=[];
  txAll().forEach(function(t){ moved.forEach(function(mv){ if(t.k==='e'&&t.sub===mv.from){ back.push([t,t.main]); t.main=mv.main; } }); });
  TXV++; prep(); render(true);
  var steps=[{fn:'saveCategories',payload:pl,rollback:function(){ back.forEach(function(b){ b[0].main=b[1]; }); TXV++; }}];
  moved.forEach(function(mv){
    var refs=txAll().filter(function(t){ return t.k==='e'&&t.sub===mv.from&&!t.pending&&!isReceipt(t)&&(t.row>0||t.srow>0); }).map(txRef);
    for(var i=0;i<refs.length;i+=MERGE_CHUNK) steps.push({fn:'editMany',payload:{items:refs.slice(i,i+MERGE_CHUNK),sub:mv.to}});
  });
  bgChain(steps,catSaved);
}

/* ══════ merging ═══════════════════════════════════════════════════════════
   Categories, subcategories or income sources that are really one: hold one
   in its list to pick it, tap the others, Merge, and say which one stays.
   The ones merged away hand everything over to it and come off the list:
   their records (every year of them - the sheet renames them in one go),
   their monthly limits and planned amounts (added together), and the quick
   actions, shop rules and Calendar payments that name them. A subcategory
   merged into one under another category takes its records across to that
   category as well.

   The sheet script needs nothing new for this: to it, a merge is the rename
   Settings already does, to the name of the one that stays. */
var KIND_WORD={m:['category','categories'],s:['subcategory','subcategories'],i:['source','sources']};
/* the names the app itself files things under, and what it files there */
var ROLE_WORD={corr:'balance corrections',xfer:'transfers',flag:'marks',fee:'fees',save:'savings transfers',
               refund:'refunds',debt:'debts paid back'};
var ROLE_FIXED={corr:1,xfer:1,flag:1,refund:1,debt:1};
var MERGE_CHUNK=400;
function catRole(kind,n){
  n=String(n||'');
  if(kind==='m') return '';
  if(isCorrName(n)) return 'corr';
  if(kind==='s'){
    if(isXferSub(n)) return 'xfer';
    if(isFlagName(n)) return 'flag';
    if(FEE_RE.test(n)) return 'fee';
    if(isSavingsSub(n)) return 'save';
    return '';
  }
  if(isXferSrc(n)) return 'xfer';
  if(BACK_RE.r.test(n)) return 'refund';
  if(BACK_RE.b.test(n)) return 'debt';
  return '';
}
/* why a cannot go into b - or, without b, why a cannot go anywhere; '' when it can */
function mergeWhy(kind,a,b){
  var ra=catRole(kind,a.name), rb=b?catRole(kind,b.name):'';
  if(ROLE_FIXED[ra]) return 'The app keeps '+ROLE_WORD[ra]+' under “'+strip(a.name)+'”, so that one stays as it is.';
  if(b&&ROLE_FIXED[rb]) return 'The app keeps '+ROLE_WORD[rb]+' under “'+strip(b.name)+'”, so nothing can be merged into it.';
  if(b&&ra&&ra!==rb) return 'The app keeps '+ROLE_WORD[ra]+' under “'+strip(a.name)+'”, so it can only go into another one for '+ROLE_WORD[ra]+'.';
  return '';
}
/* Changes typed on these screens and not saved yet. A merge writes the
   lists, so it would save them too, unseen - they get saved first. */
function catDirty(){
  var st=S.catSetup;
  if(!S.catM||!st) return false;
  function t(v){ return String(v==null?'':v).trim(); }
  var sm=st.mainCategories||[], mr=st.mainRows||[], i;
  if(S.catM.length!==sm.length) return true;
  for(i=0;i<sm.length;i++){ var m=S.catM[i]; if(m.row!==(mr[i]||0)||t(m.name)!==sm[i]||m.icon) return true; }
  var ss=st.subcategories||[];
  if(S.catS.length!==ss.length) return true;
  for(i=0;i<ss.length;i++){
    var a=S.catS[i], b=ss[i];
    if(a.row!==(b.row||0)||t(a.name)!==b.name||a.main!==b.main||(a.real!==false)!==(b.real!==false)||
       t(a.limit)!==t(b.limit)||t(a.shop)!==t(b.shop)||a.icon) return true;
  }
  var si=st.incomeSources||[];
  if(S.catI.length!==si.length) return true;
  for(i=0;i<si.length;i++){
    var c=S.catI[i], d=si[i];
    if(c.row!==(d.row||0)||t(c.name)!==d.name||(c.real!==false)!==(d.real!==false)||c.icon) return true;
  }
  return false;
}
function mergeReady(){
  if(catBusyNow()){ toast('The last change is still saving. One moment.'); return false; }
  if(catDirty()){ toast('Save the changes on this screen first, then merge.',5000); return false; }
  /* nothing typed here, so the lists can be made again from the sheet as
     it was last read - with its rows */
  catInit();
  return true;
}
/* a category change on its way up, here or waiting in the outbox from
   before the page was last opened: rows in Setup move when it lands */
function catBusyNow(){
  if(S.catBusy) return true;
  return qAll().some(function(e){ return e&&(e.fn==='saveCategories'||e.fn==='saveExpectations'||(e.fn==='editMany'&&e.payload&&e.payload.sub)); });
}
function catByName(kind,name){
  var l=catList(kind)||[];
  for(var i=0;i<l.length;i++) if(l[i].name===name) return l[i];

}
/* the records that name it, everything loaded counted */
function catCount(kind,name){
  var n=0;
  txAll().forEach(function(t){
    if(kind==='m'){ if(t.k==='e'&&t.main===name) n++; }
    else if(kind==='s'){ if(t.k==='e'&&t.sub===name) n++; }
    else if(t.k==='i'&&t.source===name) n++;

}
function recWord(n){ return n===1?'1 record':n+' records'; }
function kidsWord(n){ return n===1?'1 subcategory':n+' subcategories'; }
function numOr0(v){ var n=Number(String(v==null?'':v).replace(',','.')); return isFinite(n)?n:0; }
function listWords(l,max){
  if(l.length>max) return l.slice(0,max).join(', ')+' and '+(l.length-max)+' more';
  if(l.length<2) return l.join('');
  return l.slice(0,-1).join(', ')+' and '+l[l.length-1];
}
function kidsOf(name){ return S.catS.filter(function(x){ return x.main===name; }); }
function mergeItem(kind,x){
  var n=catCount(kind,x.name), bits=[];

}
function drawCatList(k){ if(k==='m') drawMains(); else if(k==='i') drawSrcs(); else drawSubs(); }
/* the button in the middle: which of the picked ones stays? */
function catMergeGo(){
  var k=S.csel&&S.csel.kind; if(!k) return;

function catMergeKeep(P){
  if(!P&&S.mrg) P={kind:S.mrg.kind,names:S.mrg.from.concat([S.mrg.into])};
  if(!P) return;

  if(items.length<2){ S.csel=null; S.mrg=null; drawCatList(k); return; }
  /* the one that stays has to be able to take every other one */
  var fits=items.filter(function(b){ return items.every(function(a){ return a===b||!mergeWhy(k,a,b); }); });
  if(!fits.length){
    var w=''; items.forEach(function(a){ items.forEach(function(b){ if(!w&&a!==b) w=mergeWhy(k,a,b); }); });
    toast(w||'These cannot be merged into one.',6000); return;
  }
  openPicker({title:'Keep which one?',current:S.mrg?S.mrg.into:'',
    groups:[{label:'',items:fits.map(function(x){ return mergeItem(k,x); })}],
    apply:function(v){
      S.mrg={kind:k,from:items.filter(function(x){ return x.name!==v; }).map(function(x){ return x.name; }),into:v};
      drawMerge();

function mergeBack(){

}
function mrgSide(kind,x){
  var bits=[];
  if(kind==='s') bits.push(strip(x.main));
  if(kind==='m') bits.push(kidsWord(kidsOf(x.name).length));
  bits.push(recWord(catCount(kind,x.name)));
  return '<div class="mrgside">'+icBadge(edIcon(x,kind),edHue(x,kind))+
    '<span class="mrgn"><b>'+esc(strip(x.name))+'</b><i>'+esc(bits.join(' · '))+'</i></span></div>';
}
/* the planned amount of one line (or lines) by name */
function expOf(kind,name){
  var e=D.expectations||{}, l=(kind==='i'?e.income:e.expenses)||[], v=0;
  l.forEach(function(x){ if(x.name===name) v+=Number(x.expected)||0; });
  return v;
}
/* the quick actions, shop rules and Calendar payments that name it */
function mergeUses(kind,name){
  var u={quick:0,rules:0,cal:0};
  (D.quick||[]).forEach(function(a){
    if((kind==='s'&&a.sub===name)||(kind==='m'&&a.main===name)||(kind==='i'&&a.source===name)) u.quick++;
  });
  if(kind==='s'){
    var r=shopRules(), c=pref('calCat',{})||{}, k;
    for(k in r) if(r.hasOwnProperty(k)&&ruleParts(r[k]).sub===name) u.rules++;
    for(k in c) if(c.hasOwnProperty(k)&&c[k]===name) u.cal++;
  }
  return u;
}
/* an amount that never breaks from its currency sign inside a sentence */
function nbMoney(v){ return String(money(v,0)).replace(/ /g,' '); }
function quoted(l){ return l.map(function(n){ return '“'+n+'”'; }); }
/* what the merge will do, a line each, before it is done */
function mergeLines(kind,froms,b){
  var one=froms.length===1, names=froms.map(function(a){ return strip(a.name); });
  var A=esc(listWords(quoted(names),9)), B='“'+esc(strip(b.name))+'”', out=[];
  var n=0; froms.forEach(function(a){ n+=catCount(kind,a.name); });
  if(kind==='m'){
    var kids=[]; froms.forEach(function(a){ kidsOf(a.name).forEach(function(x){ kids.push(strip(x.name)); }); });
    if(kids.length) out.push((one?'Its ':'Their ')+(kids.length===1?'subcategory moves':kids.length+' subcategories move')+' under '+B+': '+esc(listWords(kids,4))+'.');
    out.push(n?('<b>'+recWord(n)+'</b> go with '+(kids.length===1?'it':'them')+'.'):'There are no records to move.');
  }else{
    out.push(n?('<b>'+recWord(n)+'</b> move to '+B+'.'):'There are no records to move.');
  }
  if(kind==='s'){
    var cross=froms.filter(function(a){ return a.main!==b.main; }), mains=[];
    cross.forEach(function(a){ var m=strip(a.main); if(mains.indexOf(m)<0) mains.push(m); });
    if(cross.length) out.push(B+' is under “'+esc(strip(b.main))+'”, so '+
      (cross.length===froms.length?'they':'the records from '+esc(listWords(quoted(cross.map(function(a){ return strip(a.name); })),9)))+
      ' leave '+esc(listWords(quoted(mains),9))+'.');
  }
  if(kind!=='m'){
    var what=kind==='i'?'income':'spending', flip=froms.filter(function(a){ return (a.real!==false)!==(b.real!==false); });
    if(flip.length) out.push((flip.length===froms.length?'They':'The records from '+esc(listWords(quoted(flip.map(function(a){ return strip(a.name); })),9)))+
      (b.real!==false?' start counting as ':' stop counting as ')+what+', like '+B+'.');
  }
  function sums(get,word,lead){
    var parts=[], tot=0;
    froms.concat([b]).forEach(function(x){ var v=get(x); if(v){ parts.push(nbMoney(v)); tot+=v; } });
    var mine=froms.some(function(x){ return get(x); });
    if(!mine) return;
    if(parts.length>1) out.push(lead+' add up: '+parts.join(' + ')+' = <b>'+nbMoney(tot)+'</b>.');
    else out.push((one?'Its ':'Their ')+word+' of '+nbMoney(tot)+' goes to '+B+'.');
  }
  if(kind==='s') sums(function(x){ return numOr0(x.limit); },'monthly limit','Monthly limits');
  if(kind!=='m') sums(function(x){ return expOf(kind,x.name); },'planned amount','Planned amounts');
  var u={quick:0,rules:0,cal:0}, bits=[];
  froms.forEach(function(a){ var v=mergeUses(kind,a.name); u.quick+=v.quick; u.rules+=v.rules; u.cal+=v.cal; });
  if(u.quick) bits.push(u.quick===1?'1 quick action':u.quick+' quick actions');
  if(u.rules) bits.push(u.rules===1?'1 shop rule':u.rules+' shop rules');
  if(u.cal) bits.push(u.cal===1?'1 Calendar payment':u.cal+' Calendar payments');
  if(bits.length) out.push(esc(listWords(bits,9))+(bits.length===1&&/^1 /.test(bits[0])?' switches':' switch')+' to '+B+'.');
  out.push(A+(one?' comes':' come')+' off the list.');
  return out;
}
function drawMerge(){
  var M=S.mrg; if(!M) return;
  var kind=M.kind, b=catByName(kind,M.into);
  var froms=M.from.map(function(n){ return catByName(kind,n); }).filter(Boolean);
  if(!b||!froms.length||froms.indexOf(b)>-1){ S.mrg=null; drawCatList(kind); return; }
  var why=''; froms.forEach(function(a){ if(!why) why=mergeWhy(kind,a,b); });
  var h=sheetTop('Merge','','mergeBack()')+'<i id="mrgscr" hidden></i>';
  h+='<div class="glass mrgpair">'+froms.map(function(a){ return mrgSide(kind,a); }).join('')+
    '<div class="mrgarrow">'+svgIc('chevdown',16,2.4)+'</div>'+mrgSide(kind,b)+'</div>';
  var all=froms.concat([b]);
  var other=froms.some(function(c){ return all.every(function(a){ return a===c||!mergeWhy(kind,a,c); }); });
  if(other) h+='<button class="mrgswap" onclick="catMergeKeep()">Keep another one</button>';
  h+='<div class="glass mrgsum">'+mergeLines(kind,froms,b).map(function(l){ return '<div class="mrgline">'+l+'</div>'; }).join('')+'</div>';
  if(why) h+='<p class="setfoot bad">'+esc(why)+'</p>';
  else h+='<button class="paybtn mrggo" style="background:linear-gradient(160deg,'+ok(.66,.13,255)+','+ok(.55,.15,255)+')" onclick="doMerge()">'+
    'Merge into “'+esc(strip(b.name))+'”</button>'+
    '<p class="tiny" style="margin:10px 6px 0;text-align:center">This cannot be undone.</p>';
  h+=sheetEnd();
  document.getElementById('modal').innerHTML=h;
}
function doMerge(){
  var M=S.mrg; if(!M||!mergeReady()) return;
  var kind=M.kind, into=M.into, fromNames=M.from.slice();
  function look(){ return {b:catByName(kind,into),froms:fromNames.map(function(n){ return catByName(kind,n); })}; }
  var L0=look();
  if(!L0.b||!fromNames.length||L0.froms.some(function(a){ return !a||a===L0.b; })) return;
  var why=''; L0.froms.forEach(function(a){ if(!why) why=mergeWhy(kind,a,L0.b); });
  if(why){ toast(why,6000); return; }
  if(offline()){ toast('Merging needs a connection.'); return; }
  if(UNDO||Object.keys(S.pending||{}).length||qCount()){ toast('Something is still saving. Try again in a moment.'); return; }
  var cross=kind==='s'&&L0.froms.some(function(a){ return a.main!==L0.b.main; });
  S.catBusy=true;
  toast('Merging…',8000);
  /* a subcategory that crosses into another category takes its records
     along one by one (below), so the history older than the two years on
     the phone has to be here first */
  if(cross) loadOlderThen(go,function(){
    S.catBusy=false;
    toast('The older records did not load, so nothing was merged. Try again in a moment.',6000);
  });
  else go();
  function go(){
    S.mrg=null; S.csel=null;
    var LL=look(), b=LL.b, froms=LL.froms;
    if(!b||froms.some(function(a){ return !a; })){ S.catBusy=false; return; }
    var L=catList(kind), first=froms[0], kept={}, k;
    for(k in b) if(b.hasOwnProperty(k)) kept[k]=b[k];
    /* the row of the first one merged, with the name of the one that stays:
       the sheet script reads that as a rename and rewrites every record */
    kept.row=first.row;
    if(kind==='s'){
      var lim=numOr0(b.limit); froms.forEach(function(a){ lim+=numOr0(a.limit); });
      kept.limit=lim?lim:'';
      froms.forEach(function(a){ if(!kept.shop&&a.shop) kept.shop=a.shop; });
    }
    function copy(x,patch){ var c={}, j; for(j in x) if(x.hasOwnProperty(j)) c[j]=x[j]; for(j in patch) c[j]=patch[j]; return c; }
    /* the first write: the one kept, where it was; any others merged are
       renamed where they stand - a rename of their own records each */
    var call1=[], fin=[];
    L.forEach(function(x){
      if(x===first) return;
      if(x===b){ call1.push(kept); fin.push(kept); return; }
      /* no limit on these copies: if the second write never comes, a limit
         counted once per copy would be counted several times */
      if(froms.indexOf(x)>-1){ call1.push(copy(kept,kind==='s'?{row:x.row,limit:''}:{row:x.row})); return; }
      call1.push(x); fin.push(x);
    });
    function keep(l){ return l.filter(function(x){ return String(x.name).trim(); }); }
    /* no row numbers: to the sheet script nothing in it is a rename */
    function rowless(l){ return keep(l).map(function(x){ return copy(x,{row:0}); }); }
    var ns=S.catS, p1, p2=null, many=froms.length>1;
    if(kind==='m'){
      ns=S.catS.map(function(x){ return fromNames.indexOf(x.main)>-1?copy(x,{main:into}):x; });
      p1={mains:keep(call1),subs:keep(ns)};
      if(many) p2={mains:rowless(fin)};
    }else if(kind==='s'){
      p1={subs:keep(call1)}; if(many) p2={subs:rowless(fin)};
    }else{
      p1={sources:keep(call1)}; if(many) p2={sources:rowless(fin)};
    }
    var steps=[];
    if(cross){
      /* Across a category line the rename is not enough: every record's
         category changes too. Those go up first, so that if anything stops
         half way nothing is left naming something that is gone. */
      var crossed=froms.filter(function(a){ return a.main!==b.main; }).map(function(a){ return a.name; });
      var refs=txAll().filter(function(t){
        return t.k==='e'&&crossed.indexOf(t.sub)>-1&&!t.pending&&!isReceipt(t)&&(t.row>0||t.srow>0);
      }).map(txRef);
      for(var i=0;i<refs.length;i+=MERGE_CHUNK) steps.push({fn:'editMany',payload:{items:refs.slice(i,i+MERGE_CHUNK),sub:into}});
    }
    /* copies: they may go up only after the records, and the lists on
       screen can be typed into meanwhile */
    steps.push({fn:'saveCategories',payload:JSON.parse(JSON.stringify(p1))});
    /* several merged at once: the list is written once more as it ends up,
       one entry for the one kept */
    if(p2) steps.push({fn:'saveCategories',payload:JSON.parse(JSON.stringify(p2))});
    /* planned lines that now carry one name: the first takes the sum */
    if(kind!=='m') steps.push(function(){ return expJoin(kind,into); });
    fromNames.forEach(function(f){ mergeLocal(kind,f,into,b,kept); });
    if(kind==='m'){ S.catM=fin; S.catS=ns; } else if(kind==='s') S.catS=fin; else S.catI=fin;
    S.catPost=catSig();
    drawCatList(kind);
    var M2={kind:kind,from:fromNames,into:into,bMain:kind==='s'?b.main:''};
    bgChain(steps,function(ok){ mergeDone(M2,ok); });
  }
}
/* on screen at once, the way the sheet will have it */
function mergeLocal(kind,from,into,b,kept){
  var bMain=kind==='s'?b.main:'', real=b.real!==false;
  txAll().forEach(function(t){
    if(kind==='i'){ if(t.k==='i'&&t.source===from){ t.source=into; if(!outOfStats(t)) t.real=real; } return; }
    if(t.k!=='e') return;
    if(kind==='m'){ if(t.main===from) t.main=into; return; }
    if(t.sub===from){ t.sub=into; if(bMain) t.main=bMain; if(!outOfStats(t)) t.real=real; }
  });
  var st=D.setup;
  if(kind==='m'){
    var mi=(st.mainCategories||[]).indexOf(from);
    if(mi>=0){ st.mainCategories.splice(mi,1); if(st.mainRows) st.mainRows.splice(mi,1); }
    (st.subcategories||[]).forEach(function(x){ if(x.main===from) x.main=into; });
    if(S.open&&S.open['cat:'+from]){ S.open['cat:'+into]=true; delete S.open['cat:'+from]; }
  }else if(kind==='s'){
    st.subcategories=(st.subcategories||[]).filter(function(x){ return x.name!==from; });
    st.subcategories.forEach(function(x){
      if(x.name===into){ x.limit=kept.limit===''?null:Number(kept.limit); x.shop=kept.shop; }
    });
  }else{
    st.incomeSources=(st.incomeSources||[]).filter(function(x){ return x.name!==from; });
  }
  if(kind!=='m'&&D.expectations){
    var key=kind==='i'?'income':'expenses', list=D.expectations[key]||[], fa=null, fb=null;
    list.forEach(function(x){ if(x.name===from&&!fa) fa=x; else if(x.name===into&&!fb) fb=x; });
    if(fa&&fb){
      fb.expected=(Number(fb.expected)||0)+(Number(fa.expected)||0);
      D.expectations[key]=list.filter(function(x){ return x!==fa; });
    }else if(fa) fa.name=into;
  }
  function sw(l){
    if(!l||l.indexOf(from)<0) return l;
    var o=l.filter(function(x){ return x!==from; });
    if(o.indexOf(into)<0) o.push(into);
    return o;
  }
  if(kind==='m') S.fCat=sw(S.fCat); else if(kind==='s') S.fSub=sw(S.fSub); else S.fSrc=sw(S.fSrc);
  TXV++; prep(); render(true);
}
/* the quick actions, shop rules, Calendar payments and picked icons that
   name the ones that went */
function mergePrefs(kind,froms,into,bMain){
  function gone(n){ return froms.indexOf(n)>-1; }
  var changed=false;
  var nq=(D.quick||[]).map(function(a){
    var hit=(kind==='s'&&gone(a.sub))||(kind==='m'&&gone(a.main))||(kind==='i'&&gone(a.source));
    if(!hit) return a;
    var c={}; for(var k in a) if(a.hasOwnProperty(k)) c[k]=a[k];
    if(kind==='s'){ c.sub=into; if(bMain) c.main=bMain; }
    else if(kind==='m') c.main=into; else c.source=into;
    changed=true; return c;
  });
  if(changed){
    var backup=D.quick; D.quick=nq;
    bg('saveQuick',{list:nq,light:true},null,function(){ D.quick=backup; });
  }
  if(kind==='s'){
    var r=shopRules(), nr={}, rc=false, n;
    for(n in r) if(r.hasOwnProperty(n)){
      var p=ruleParts(r[n]);
      if(gone(p.sub)){ nr[n]=p.acc?{sub:into,acc:p.acc}:into; rc=true; } else nr[n]=r[n];
    }
    if(rc) setPref('shopCat',nr);
    var cc=pref('calCat',{})||{}, nc={}, cch=false;
    for(n in cc) if(cc.hasOwnProperty(n)){ if(gone(cc[n])){ nc[n]=into; cch=true; } else nc[n]=cc[n]; }
    if(cch) setPref('calCat',nc);
  }
  var ov=iconOverrides(), ni={}, ich=false;
  for(var x in ov) if(ov.hasOwnProperty(x)){ if(gone(x)) ich=true; else ni[x]=ov[x]; }

/* planned lines that now carry one name: one line, the sum */
function expJoin(kind,name){
  var e=D.expectations||{};
  var l=((kind==='i'?e.income:e.expenses)||[]).filter(function(x){ return x.name===name; });
  if(l.length<2) return null;

  var total=0; l.forEach(function(x){ total+=Number(x.expected)||0; });
  return {fn:'saveExpectations',payload:{edits:[{row:l[0].row,col:l[0].col,value:total}],
    deletes:l.slice(1).map(function(x){ return {row:x.row,col:x.col}; }),adds:[]}};
}
/* Writes that have to land in order: each goes up once the one before it
   has come back, a step given as a function is worked out only then, and a
   refusal stops the rest. */
function bgChain(steps,done){
  var i=0, handed=false;
  /* A step parked in the outbox (no connection, or no answer) takes the
     steps after it along, in order: the outbox outlives a reload, the chain
     does not. Only plain steps go - one worked out from the answers before
     it has to wait for them. */
  function handOff(){
    if(handed) return;
    for(var j=i;j<steps.length;j++) if(typeof steps[j]==='function') return;
    handed=true;
    for(;i<steps.length;i++){
      var st=steps[i]; if(!st) continue;
      if(st.payload&&typeof st.payload==='object'&&!(st.payload instanceof Array)&&!st.payload.rid) st.payload.rid=newRid();
      qPush('q'+(++S.qid),st.fn,st.payload);
    }
  }
  (function next(){
    var st=steps[i++];
    if(st===undefined){ if(done) done(true); return; }
    if(typeof st==='function') st=st();
    if(!st){ next(); return; }
    var bad=false, fired=false;
    var undo=st.rollback, after=st.cleanup;
    bg(st.fn,st.payload,
      /* a step sent again after a slow answer can come back twice */
      function(){ if(fired) return; fired=true; if(after) after(); setTimeout(function(){ if(bad){ if(done) done(false); } else next(); },0); },
      function(){ bad=true; if(undo) undo(); },
      handOff);
  })();
}
function mergeDone(M,ok){
  if(ok) toast('Merged into “'+strip(M.into)+'”');
  /* Read once more, now that everything has landed: an answer that crossed
     one of these on the way may have been read before a write. Refused
     somewhere on the way, this is also the truth about how far it got. */
  var seq=++S.seq;
  API.call('bootstrap',{fresh:true},function(err,res){
    if(!err&&res) applyData(res,seq);
    if(ok) mergePrefs(M.kind,M.from,M.into,M.bMain);

/* The Settings lists again, from what the sheet has now: a list moves its
   rows when it is written back, and a save must never go out with the old
   ones. Whatever part of Settings is open is drawn again. */
function catRefresh(M){
  if(!S.catM) return;
  var eds=[['subedscr','subD','subI','s'],['mainedscr','mainD','mainI','m'],['srcedscr','srcD','srcI','i']];
  var open=null;
  eds.forEach(function(e){ if(!open&&document.getElementById(e[0])&&S[e[1]]) open=e; });
  /* changed by hand while it was on its way: those changes stay, the ones
     merged away go, and the rows are brought up to date */
  var edited=!!S.catPost&&catSig()!==S.catPost;
  S.catPost=null;
  if(edited){
    if(M&&M.from){
      var L=catList(M.kind);
      for(var j=L.length-1;j>=0;j--) if(M.from.indexOf(L[j].orig)>-1&&L[j].name===L[j].orig) L.splice(j,1);
      if(M.kind==='m') S.catS.forEach(function(x){ if(M.from.indexOf(x.main)>-1) x.main=M.into; });
    }
    catRows();
    return;
  }
  catInit();
  var el=document.getElementById('catscr');
  if(el){ drawCatList(el.getAttribute('data-k')); return; }
  if(document.getElementById('setscr')){ drawSettings(); return; }
  if(open){
    var d=S[open[1]], list=catList(open[3]), i=-1;
    list.forEach(function(x,j){ if(d.orig&&x.name===d.orig) i=j; });
    if(d.row&&i<0){ S[open[1]]=null; drawCatList(open[3]); return; }
    S[open[2]]=i; if(i>=0) d.row=list[i].row;
  }
}
/* the lists, reduced to what a save would send */
function catSig(){
  function one(x){ return [x.row,x.name,x.main||'',x.real!==false,String(x.limit==null?'':x.limit),x.shop||'',x.icon||''].join('\\u0001'); }
  return [S.catM,S.catS,S.catI].map(function(l){ return (l||[]).map(one).join('\\u0002'); }).join('\\u0003');
}
/* the rows the sheet has now, found by the name each entry had when saved */
/* false when one of them is no longer on the sheet under the name it had:
   the lists are older than the sheet, and a save would undo what changed */
function catRows(){
  var st=D.setup, mr={}, sr={}, ir={}, gone=false;
  (st.mainCategories||[]).forEach(function(n,i){ mr[n]=(st.mainRows||[])[i]||0; });
  (st.subcategories||[]).forEach(function(x){ sr[x.name]=x.row||0; });
  (st.incomeSources||[]).forEach(function(x){ ir[x.name]=x.row||0; });
  function fix(map,list){ return function(x){
    if(!x||!x.orig) return;
    if(map.hasOwnProperty(x.orig)) x.row=map[x.orig];
    else { x.row=0; if(list) gone=true; }
  }; }
  (S.catM||[]).forEach(fix(mr,1)); (S.catS||[]).forEach(fix(sr,1)); (S.catI||[]).forEach(fix(ir,1));
  fix(sr)(S.subD); fix(mr)(S.mainD); fix(ir)(S.srcD);
  S.catSetup=st;
  return !gone;
}

/* the history older than the two years the phone keeps, then cb */
function loadOlderThen(cb,fail){
  if(S.older){ cb(); return; }
  API.call('olderTx',null,function(err,res){
    if(err){ if(fail) fail(err); else cb(); return; }
    if(!S.older){
      var pd=S.pendingDel||{};
      S.older=((res&&res.older)||[]).map(function(t,i){ t.srow=t.row; t.row=-(i+1); return t; })

    }
    cb();
  });
}

/* ══════ refunds and money owed to you ══════════════════════════════════
   Both end the same way: money comes back. The purchase stays in the list,
   greyed out, and what came back is written as an income on whichever
   account it reached - so every balance stays right while neither of the
   two counts as spending or income. The sheet script links them by id
   (the purchase's id plus -r or -b) and keeps both out of its own totals. */
var NEED_V3='Paste the new Code.gs into the spreadsheet and update the deployment first \u2014 the old script cannot keep this.';
var NEED_V5='Paste the new Code.gs into the spreadsheet and update the deployment first \u2014 the old script cannot do this.';
var BACK_RE={r:/refund|повернення\s*кошт|возврат\s*(средств|денег)/i,
             b:/debt\s*return|return(ed)?\s*debt|повернення\s*борг|возврат\s*долг/i};
function backSource(kind){
  var l=(D.setup&&D.setup.incomeSources)||[];
  for(var i=0;i<l.length;i++) if(BACK_RE[kind].test(l[i].name)) return l[i].name;
  return '';
}
/* something bought: not money moved between your own accounts, not a fix */
function isPurchase(t){ return !!t&&t.k==='e'&&!isXfer(t)&&!isCorr(t)&&!isXferSub(t.sub); }
function paidOf(t){ return Math.abs(Number(isReceipt(t)?t.rtotal:t.amount)||0); }
function accOptions(sel){
  var l=(D.accounts||[]).map(function(a){ return a.name; });
  if(sel&&l.indexOf(sel)<0) l.unshift(sel);
  return l.map(function(n){ return opt(n,strip(n),n===sel); }).join('');
}
/* the panel: how much came back, to which account, on which day */
/* The money that comes back is tied to the purchase by the purchase's id
   (the income's id is that id plus -r or -b). A record that is saved but
   has no id yet - typed into the sheet by hand, say - gets one the next
   time the app reads the sheet, so it reads it once, right now, and then
   carries on by itself. Only when the sheet has no ID column at all is
   there nothing to wait for, and then it says what to do instead. */
var NO_ID_MSG='This record has no ID in the spreadsheet yet, so the money cannot be tied to it. In the sheet run Budget \u2192 Upgrade data for the new app (run once), then pull down here to refresh.';
function withRecordId(row,go){
  var t=findTx('e',row); if(!t) return;
  /* on its way up: the sheet has not got it yet */
  if(t.pending||!t.row){ toast('Wait a moment \u2014 it is still saving'); return; }
  if(t.id){ go(t); return; }
  if(D.v2===false){ toast(NO_ID_MSG,9000); return; }
  if(S.idWait) return;
  var was={date:t.date,amount:t.amount,account:t.account,sub:t.sub||'',shop:t.shop||''};
  S.idWait=true; toast('One moment\u2026');
  var gaveUp=false, guard=setTimeout(function(){ gaveUp=true; S.idWait=false; toast('The sheet did not answer. Try again in a moment'); },45000);
  API.call('bootstrap',{fresh:true},function(err,res){
    clearTimeout(guard);
    if(gaveUp) return;
    S.idWait=false;
    if(err){ toast(err); return; }
    applyData(res,++S.seq);
    /* rows may have moved in the meantime: find it again by what it is */
    function same(x){ return x&&x.k==='e'&&x.date===was.date&&Number(x.amount)===Number(was.amount)&&x.account===was.account; }
    var t2=findTx('e',row);
    if(!same(t2)) t2=txAll().filter(function(x){ return same(x)&&(x.sub||'')===was.sub&&(x.shop||'')===was.shop; })[0]||null;
    if(t2&&t2.id) go(t2); else toast(NO_ID_MSG,9000);
  });
}
